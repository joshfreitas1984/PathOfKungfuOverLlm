- raw: "再过七招，纪雨竹招式运用愈发纯属，内息身法亦越发圆融，只听她一声清喝，手中兵刃，已然稳稳停在了石庆胸膛之前……"
  result: "After seven more moves, Ji Yuzhu's execution of her Moves became increasingly pure, and her Inner Qi and Agility grew ever more seamless. Suddenly, she let out a clear cry, and her weapon came to a steady halt before Shiqing's chest..."
- raw: "予些银钱。（需银钱十文）"
  result: "Give me some silver. (Requires 10 Silver)"
- raw: "大雪山中的人也是人，整日练刀杀生，不行农事，吃穿用度，可要赖咱候刀镇三分。"
  result: "The people of Daxue Mountain are people too, but they spend their days practicing blades and taking lives, with no farming. Their food, clothing and daily needs depend, to some degree, on our Hou Dao Town."
- raw: "前方过了摩崖三佛，便是第二关所在。第二关暗号取自《四十二章经·第十九章》，守关者会念“佛言：当念身中四大，各自有名，都无我者”，正确应答原是“我既都无，其如幻耳”……"
  result: "Beyond the Three Buddha Cliff Carvings lies the second pass. Its password is taken from Chapter 19 of the Forty-Two Chapter Sutra. The gatekeeper will recite, “The Buddha said: contemplate the four great elements within the body; each has its own name, and none of them is the self,” and the correct reply is, “Since there is no self, it is but an illusion”..."
- raw: "三月廿三，收流民赵三牛捐田契（洛阳西郊旱田十亩）。注：为祈雨法事，田契暂押寺中，若明年无收成则归寺产。"
  result: "March 23, received a land donation deed from refugee Zhao Sanniu (ten acres of dry fields west of Luoyang). Note: As part of the rain-praying ritual, the land deed is temporarily held at the temple. If there is no harvest next year, it will become temple property."
- raw: "自是记得。洪帮主对老衲说，此事不在于他是战是逃……朝廷令魏无忌马踏江湖，是顾忌江湖门派势大，丐帮为天下第一大帮，弟子遍及南北，人众以十万计。若不能有所交代，即便表示顺服，皇帝又如何安心？"
  result: "Of course, I remember. Hong, the Sect Leader, told this monk that the matter does not lie in whether he fights or flees... The imperial court ordered Wei Wuyi to ride roughshod over Jianghu because they fear the power of the sects. As the Beggar Sect is the largest in the land, with disciples spread across the north and south, numbering in the hundreds of thousands, if there is no explanation given, even showing submission, how can the emperor feel at ease?"
- raw: "夏四月戊辰，临安县。"
  result: "The Wuchen day of the fourth month of summer, in Lin'an County."
- raw: "一只遗失的鞋履。"
  result: "A lost shoe."
- raw: "为虎作伥-分支一"
  result: "Abetting the Tiger-Branch One"
- raw: "不错，果果虽是肚里能撑船，然碰上正事，终究不似咱们这般男子汉大丈夫……"
  result: "True, Guoguo may be big-hearted and forgiving, but when it comes to serious matters she is ultimately not like us menfolk..."
- raw: "自你初入襄阳，曹辅之允你出行自由，便是疑我在此，乃投石问路之举。诱饵既放，自需时时查记去向。"
  result: "Ever since you first entered Xiangyang, Cao Fuzhi has let you travel freely. That is because he suspects I am here, and it is a probe to test the waters. Now that the bait is laid, he must keep track of where it goes at all times."
- raw: "他们若真是服毒自尽的歹人探子，久不回信，必会有人前来探查，我等不妨在此守株待兔，点其穴道以防服毒，再生擒活口，问个明白。"
  result: "If they really are the poison-taking spies of villains, someone will surely come to investigate when no word comes back for a long time. We might as well wait here for them to walk into our trap, seal their acupoints so they cannot take poison, then capture them alive and get the truth out of them."
- raw: "此后悠悠千载，白云苍狗，浮驹过隙，世间万物于你看来，不过俯仰之间，片刻稍失，你即为此间，此间即为你，玄之又玄，无上洞玄……"
  result: "In the thousand years that followed, white clouds turned to hounds and the years slipped by like a colt past a crack. To you, all things in the world were but the blink of an eye; a moment's lapse, and you are this place and this place is you, profound beyond profound, the supreme Dongxuan......"
- raw: "我夫妻二人，愿下辈子结草衔环，以报答恩人……"
  result: "In our next life, my husband and I will repay our benefactor even if it means tying knots of grass and bearing rings in gratitude..."
- raw: "受到伤害时，有25%概率"
  result: "When taking damage, there is a 25% chance to"
- raw: "被动招式：额外提升暴击伤害减免属性15%。"
  result: "Passive Move: Additionally increases the Crit Damage Reduction Attribute by 15%."
- raw: "你参见端木清，得掌门真人传唤。她托你见过掌门后，将功课经册分发与门中同辈。"
  result: "You pay your respects to Duanmu Qing and receive a summons from the Sect Leader. She asks you to distribute the lesson scriptures to your peers in the sect after you have seen the Sect Leader."
- raw: "你剿除东瀛，返回京城，已是决定天命所归之时。"
  result: "You have wiped out Dongying and returned to the capital; now is the time to decide who the Mandate of Heaven favors."
- raw: "在下发妻自育有果果，心智大变。视果果为禁脔，尝将小女培养成复仇利器。故当这孽障伤了小女，贱内自然大发雷霆，一度想伤其性命。事后虽得我力保，这孽畜侥幸得存，然贱内心意已决，遂将其逐出家门，弃于山中。"
  result: "After my wife gave birth to Guoguo, her mind changed greatly. She treated Guoguo as her private treasure and tried to raise the girl as a weapon of revenge. So when this wretched beast hurt the girl, my wife naturally flew into a rage and once even wanted to take its life. Though I pleaded for it and, by luck, it survived, my wife had made up her mind and drove it out of the house, abandoning it in the mountains."
- raw: "在下发妻自育有果果，心智大变。视果果为禁脔，尝将小女培养成复仇利器。故当这孽障伤了小女，贱内自然大发雷霆，一度想伤其性命。事后虽得我力保侥幸得存，然贱内心意已决，遂将其逐出家门，弃于山中。"
  result: "After my wife gave birth to Guoguo, her mind changed greatly. She treated Guoguo as her private treasure and tried to raise the girl as a weapon of revenge. So when this wretched beast hurt the girl, my wife flew into a rage and once even wanted to take its life. Though I managed to protect it and it narrowly survived, my wife had made up her mind and drove it out of the house, abandoning it in the mountains."
- raw: "神州积弊如今，流民万里，这“智绝”之称，当真是众口铄金，积毁销骨，红玉纵使心有千般智计，如何挡得住天下人百万雄师？"
  result: "In this time of corruption throughout the land, refugees stretch for ten thousand li. This title of 'Wisest Strategist' truly is a case of slanderous tongues eroding truth; how can Hongyu's myriad schemes withstand Tian Xia Ren's million-strong army?"
- raw: "宋掌门昔年智退镇国卫，保下神秀峰百年基业，更曾计退大雪山，令定海石不至落入贼手，左某可是心服口服，“智绝”二字，当之无愧。"
  result: "Sect Leader Song outwitted the Imperial Guard in years past and safeguarded Shenxiu Peak's century-long legacy. He also devised a plan to repel Daxue Mountain, ensuring that the Sea-Calming Stone did not fall into the hands of bandits. I am thoroughly convinced; he is indeed worthy of the title Wisdom Par Excellence."
- raw: "有此二者，外敌无可当，内乱不能守，唯以沉疴猛药，方能治之。"
  result: "With these two afflictions, we cannot withstand foes from without nor hold against chaos within; only powerful medicine for a deep-rooted illness can cure it."
- raw: "你这一身绝世武功倒是无处使用，用到抓糟老头喝酒之上，也不知羞！"
  result: "All that peerless martial skill, and you have no use for it except grabbing a scruffy old man to drink with. Have you no shame!"
- raw: "街坊邻里的，不用钱，赶明若是好了，多替我拉些病患便是。"
  result: "We're neighbors, no charge. If you get better, just send me more patients."
- raw: "呵！怕不是你陈百户，怨人看病不给钱，自己下的毒罢？"
  result: "Ha! Could it be that you, Chen the Constable, resented people not paying for treatment and poisoned them yourself?"
- raw: "要害陈某，多的是法子，何故如此行事！"
  result: "If you wanted to harm Chen Meng, there are plenty of ways. Why act like this!"
- raw: "国公为免天下苍生之苦，将镇派三石私藏而下，自是碍了他的眼，阻了他的道。狡兔死走狗烹，古往今来，皆是如此。"
  result: "For the sake of the common people, the Duke Marquis kept the Three Precious Stones of his sect hidden, which naturally offended him and hindered his path. When the rabbit is dead, the hunting dog is cooked; throughout history, it has always been thus."
- raw: "然探花中人，行事极为隐秘，我还需往壁城水寨走上一遭，查探不二禅舍利下落之事，便交予你手了。"
  result: "But the Tanhua are extremely secretive in their dealings. I still have to make a trip to the Bicheng Water Stronghold to look into the whereabouts of the Non-Dual Zen Relic, so this matter I leave to you."
- raw: "探花行事，百无禁忌，若他人负责之事自己并无把握，你亦有心去分一杯羹，自可在此间随意走走，寻些事做。"
  result: "The Tanhua act without taboo. If there is something someone else is handling that you are unsure about, and you want a share of it, feel free to wander around here and find something to do."
- raw: "玄参案后，董大人不降反升，那时李麒便同国公进言，令他小心提防，只惜国公认你是当世大儒，朝中清流，故此未曾纳谏。"
  result: "After the Xuan Can case, Lord Dong was promoted rather than demoted. Back then, Li Qi urged the Duke to be on guard against him, but the Duke regarded you as a great scholar of the age and a paragon among the court's upright officials, so he never took the advice."
- raw: "领头那人掘土搬石，抬块几十斤的石头连气都不喘，若是你不是真江湖大侠，咱们还是趁早逃命，更为要紧……"
  result: "The leading person dug and moved stones, lifting a boulder weighing several dozen pounds without even catching their breath. If you are not a true Jianghu Great Hero, we should flee for our lives..."
- raw: "教主娘娘宽宏大量，正所谓冤冤相报何时了……罔顾若不领情，倒显我大理段氏不明是非……段绍裘玩权弄术，致使段氏裂为两派，挑起此战，置段氏一族于累卵之危，罔顾既为一族之长，清理门户，便是分内之事。"
  result: "The Lady Leader is magnanimous; as they say, when will the cycle of vengeance end... If Wanggu does not accept this grace, it would show that I, of the Dali Duan Clan, am unable to distinguish right from wrong... Duan Shaoqiu manipulates power, causing the Duan Clan to split into two factions and inciting this conflict, placing our entire clan in grave danger. Since Wanggu is the head of the clan, cleansing the house is his duty."
- raw: "话音落下，老者取出一支骨笛吹响，悠扬笛音传出，随后她便与其余人带上此间尸首，一同转身离去。"
  result: "As the words fell, the old woman took out a bone flute and blew it, and a lilting tune drifted out. Then she and the others took the corpse here and turned away together."
- raw: "阁下今日到这楼兰古城，本是不该留你性命，一来以我的身手怕是杀你不得，二来阁下如此修为，你我合力，必能功成。"
  result: "Coming to this ancient city of Loulan today, you should by rights not be left alive. But for one, I probably could not kill you with my skill, and for another, with cultivation like yours, the two of us together are sure to succeed."
- raw: "你当即在屋中寻到一条粗编麻袋，将其自铁架上解下装入，以你如今修为，纵使身负一人，只需略施手段稍稍引开注意，绕过守门之人的视线便不算难。"
  result: "You immediately found a coarsely woven hemp sack in the room, untied it from the iron rack and loaded it into the sack; with your current cultivation level, even carrying one person wouldn't be difficult; you could easily slip past the guards' line of sight without drawing much attention."
- raw: "行啦，老头子年轻时专杀鞑子，如今身子骨大病初愈，比早年前还多些力气，能出甚么岔子？"
  result: "Come on, old man. In my youth, I specialized in killing Tartars. Now that I've just recovered from a serious illness, I'm even stronger than before. What could possibly go wrong?"
- raw: "只要暗度陈仓，将贼首除却，以本门兵力，再拒隋东关天险，守住天下人四万人马，不是难事。"
  result: "As long as we slip across in secret and eliminate the ringleader, then hold Suidong Pass's natural barrier with our sect's forces, protecting Tian Xia Ren's forty thousand troops is no difficult task."
- raw: "两军交阵变数极多，倘若我大旗门人此战死伤过半，如何守得住天下人的四万兵马？"
  result: "Battle is full of variables. If my Daqi Sect suffers more than half casualties, how could we hold Tian Xia Ren's forty thousand troops?"
- raw: "敌军四面受敌，势必首尾难顾。若是任意一路出了岔子，他们便能抽出手来对付其他弟兄。"
  result: "The enemy is surrounded on all sides and will inevitably be unable to cope with everything. If any one of our routes goes awry, they will be able to turn their attention to the other brothers."
- raw: "你将赶来官差视如草芥，一一击倒，随后踏步上前，一脚踏在早已惊慌失措，自绊倒地的玉玲珑胸前……"
  result: "You treat the officers who rush over as nothing, knocking them down one by one, then step forward and plant a foot on the chest of Yu Linglong, who had long since panicked and stumbled to the ground......"
- raw: "张铁兄应邀前来天涯海阁，追缉东海浪人，只是连日战局之下，气力不竭，却是失手被俘，身负重伤，不知所踪……我等苦寻半月有余，却生不得见人，死亦难见尸。"
  result: "Brother Zhang Tie came at the invitation of Tianya Haige to hunt down the East Sea ronin. But after days of continuous battle, with his strength not yet spent, he slipped up all the same and was captured, gravely wounded, and has not been seen since... We searched for more than half a month: alive, we could not find him, and dead, we could not find his body."
- raw: "你将在南屏山间发现尸首一事全盘倒出，闻听其人死状凄惨，黄莺双目怔怔，似是再无有什么情绪应答，只是陡然含笑，双目清泪却涌然而出。"
  result: "You tell her everything about finding the body in the Nanping hills. Hearing how wretched the death was, Huang Ying stares blankly, seemingly with no feeling left to respond, and then suddenly smiles while clear tears gush from her eyes."
- raw: "此物替妾身还给李青山，让他莫再痴心纠缠不休了……肉痴大爷将我奉为贵宾在此，妾身甚是快活。"
  result: "Please return this to Li Qingshan for me, and tell him to stop pining and pestering me... Lord Carnal Delight treats me as an honored guest here, and I am very happy."
- raw: "前些时日确有一封书信送至武馆，信中署名便是“魏承”，只道曾指点一青萍后进前来武馆，或需以家传武学助其冲关破境，想来便是你了。"
  result: "A few days ago, a letter was delivered to the Martial Arts Hall. It was signed Wei Cheng, stating that he had guided a young Green Reed disciple here to the hall and might need to use his family Martial Art to aid their Breakthrough. I assume you are the one they're referring to."
- raw: "“我自尽力为你传信，却不料阁下却推三阻四，既如此，不相见也罢。”"
  result: "I did my best to deliver the message on your behalf, but I didn't expect you to evade me. If that's how it's going to be, then perhaps we shouldn't meet at all."
- raw: "“轻功独步天下，世间招式皆难近身，内劲或膂力举世无双，亦能以力破巧……”"
  result: "Qinggong unparalleled under heaven, the moves of the world cannot come close, and even if one's Inner Force or strength is unmatched, it can still break skill with sheer power..."
- raw: "方才还说你不是庸人……看来是项某眼拙了。"
  result: "I had just said you were no mediocre man... It seems I, Xiang, misjudged you."
- raw: "“……陆雅前辈，此生于对弈都无所精擅，却能创此棋局……想来，为能让前辈回心转意，陆雅前辈亦是颇耗心神。”"
  result: "“......Senior Lu Ya, you were never skilled at the game of go in this life, yet you could devise such a board... I suppose that, to bring a senior around, Senior Lu Ya also spent no small effort.”"
- raw: "倭人起名与中原有颇多异处，这物见番头，便是他们的探子头领。"
  result: "The Wa name things quite differently from the Central Plains. This “Monomi Banto” is what they call their chief scout."
- raw: "于红梅不知何时已解决掉周围的敌人，饶有兴致地看着这一幕。见左冷认输，他面露失望之色，但转瞬便战意狂燃。"
  result: "Yu Hongmei had, at some unknown point, dispatched the surrounding enemies and was watching the scene with great interest. Seeing Zuo Leng surrender, he wore a look of disappointment but instantly his fighting spirit flared up."
- raw: "违了寺规，还胆敢提方丈！今日若是不将你这厮好生处置，难同住持交代！"
  result: "You broke the temple rules and still dare to mention the Abbot! If I don't deal with you properly today, how can I answer to the Abbot?"
- raw: "不若如此。我看阁下并非不通事理之人，只听我一家之言难免心中有疑，不妨往这洛阳城中走动一番，眼见是真！"
  result: "It would be better to do so. I see that you are not one who lacks understanding, and merely hearing my words may leave you doubtful. Why don't you walk around Luoyang City? After all, seeing is believing!"
- raw: "祝某不过一介破落秀才，实在当不得足智多谋四字，若当真料事如神，岂会令济明身陷险境，令我等落得如此之局？"
  result: "Zhu is merely a down-and-out scholar; I truly do not deserve the title of wise and resourceful. If I were truly clairvoyant, how could I have let Jiming find himself in danger and put us all in this predicament?"
- raw: "慈弘秃驴给你的银钱，够买你这条命么？"
  result: "Is the silver that baldy Cihong gave you enough to buy your life?"
- raw: "慈弘那厮向来是入夜行车，白日若去，便是自投罗网，此番既助尔等，我便助到底！"
  result: "That Cihong always travels at night; going by day would be walking right into the trap. Since I'm helping you this time, I'll help all the way!"
- raw: "帮里好多兄弟都看不惯他！他上台后，就知道抢地盘、收黑钱，哪里还管什么帮规侠义？可……可他势大，大家伙儿也不敢吭声啊。四海爷，您这次回来，可得给兄弟们做主！大目我清楚得紧，许多兄弟，他们心里还是向着四海爷的！"
  result: "The brothers in the gang can't stand him! Since he took over, all he does is grab territory and take dirty money. Who cares about the gang rules or chivalry? But... he's powerful, so no one dares to speak up. Master Four Seas, now that you're back, you've got to stand up for us brothers! I, Damu, know full well that many of the brothers still side with you, Master Four Seas!"
- raw: "至于将军……我闻将军坐镇襄阳府，拥兵十万，深得陛下委重。夜率精甲，一举除去镇国卫余孽与龙虎道脉，天下间岂不皆传将军威名？便是李公公也该为将军在御前美言几句。"
  result: "As for the General... I hear he commands Xiangyang Prefecture with a hundred thousand troops and is greatly trusted by His Majesty. If he led his elite armored troops by night and wiped out the remnants of the Imperial Guard and the Dragon-Tiger Daoist lineage in one stroke, would the General's fame not spread throughout the land? Even Eunuch Li should put in a good word for the General before the throne."
- raw: "若是楚家等不到那不成器的东西回来，没了便也没了，他不回家掌事，却将亲妹子缠在此处，是何道理？"
  result: "If the Chu family can't wait for that good-for-nothing to return, so be it; if he's gone, then he's gone. But why does he not return to take charge of the family himself, yet keeps his own sister here with him?"
- raw: "你见此情形，本想上前劝说，却见谢正青向你摆手……"
  result: "Seeing this, you meant to step in and persuade, but Xie Zhengqing waves a hand at you......"
- raw: "“谢兄心意我已知晓，待我筹备一番，再与阁下同行！”"
  result: "“Brother Xie, I understand your intentions. Let me make some preparations, and then I will travel with you!”"
- raw: "大理城内人群杂乱、摩肩接踵，阁下又初来大理，如何寻得老丈？不如先往舍下暂歇，我等护送姑娘回家令其父女团聚。"
  result: "The streets of Dali are crowded and jostling, and you are new to Dali, so how will you find the old man? Why not rest at my humble home for now while we escort the young lady home to reunite with her father?"
- raw: "我于绝处逢生间却也好奇是何人来此，竟令那魔头如临大敌，短暂调息修养之后，便强撑残躯前去一探究竟……就在那里我观摩了世间罕见的一场死斗！"
  result: "Having come back from the brink, I was curious who had come here and made that demon treat them as a great enemy. After a brief rest to recover, I forced my wrecked body onward to see for myself... and there I witnessed a duel to the death such as the world rarely sees!"
- raw: "在下无耻之行……罪责难逃……自知无可翻覆……悔之不及……事到如今，也不祈望能得以恕饶……只望阁下能速速前去……救出藤姑娘……如此，不忘虽万死，亦能瞑目……"
  result: "I have acted shamelessly... my guilt is unbearable... I know there is no turning back... regret is useless now... at this point, I do not hope for forgiveness... I only wish you would hurry to save Miss Teng... then, even if Buwang dies a thousand deaths, he can rest in peace..."
- raw: "自那时姐姐便想过，等长大了，定要挑爬上花杆的勇士做自己的如意郎君，只惜妹子是女儿身，否则……"
  result: "Ever since then, Older Sister has thought that when she grew up she would surely pick the brave man who could climb the flower pole as her ideal husband. If only your little sister weren't a girl, otherwise......"
- raw: "此事说来话长，不如先将他囚于府中的族内长老悉数解出，再作打算罢……"
  result: "It's a long story. Better first to free all the clan elders he has imprisoned in the mansion, then decide what to do......"
- raw: "“……弟子遵命。”"
  result: "“......This disciple obeys.”"
- raw: "李掌门言辞明了，又以玄岳碑相赠，明澈自当携弟子离去，再不复搅扰太和。"
  result: "Sect Leader Li has spoken plainly, and has also given the Xuanyue Stele. Mingche will naturally take the disciple and leave, never troubling Taihe again."
- raw: "离开洛阳前正好碰到前辈你，当然是要请教一番了。"
  result: "I happened to run into you, Senior, just before leaving Luoyang, so of course I wanted to ask your advice."
- raw: "人行书，曰万灵之长，非有爪牙利齿，亦无皮囊毛铠之防，唯余灵心一点，百道长存，变化万千，探天窥地，夯尽奥妙，自成生灵之首，唯人之道也。"
  result: "Humans write their own destiny, the masters of all spirits. Without sharp claws or fangs, without scales or fur for armor, they possess but a single point of spirit, yet a myriad of Dao paths endure, transforming endlessly, exploring the heavens and delving into the earth, mastering all wonders, thus becoming the pinnacle of life, the way of humanity alone."
- raw: "若大仇得报，雨竹来生此世，纵使衔草结环，亦要报谢此恩……"
  result: "If my great vengeance is repaid, then in my next life in this world I, Yu Zhu, will repay this kindness even if it means tying knots of grass and bearing rings......"
- raw: "今儿个是何时节？倒引得水寨贵客来此。"
  result: "What kind of day is it today, that it brings an honored guest of the Water Stronghold here?"
- raw: "被动招式：施展【扫岳荡丘】招式对敌人造成伤害时,额外附加1层【灼烧】效果，每叠加1层会使目标流失1%的气血，该效果可以叠加3层效果持续时间3秒。"
  result: "Passive Move: When the move [Sweeping Peaks, Razing Hills] deals damage to an enemy, it additionally applies 1 stack of [Burn]. Each stack makes the target lose 1% of their Lifeforce. This effect can stack up to 3 times and lasts for 3 seconds."
- raw: "不错，他倒也有些本事，在壁城水寨混到了供奉，假传壁城水寨命令，让那东天霸备齐火油蒙船，趁乱而入。"
  result: "Not bad, he has some skill. He worked his way up to Retainer at the Bicheng Water Stronghold, then forged an order in the Stronghold's name telling Dongtian Ba to ready fire oil and cover the ships, so he could slip in amid the chaos."
- raw: "“这……走罢。”"
  result: "“This... let's go.”"
- raw: "气血恢复属性提升5%"
  result: "Lifeforce Recovery Attribute increased by 5%"
- raw: "暴击伤减免属性增加15%"
  result: "Crit Damage Reduction Attribute increased by 15%"
- raw: "醒来以后，你只觉腿脚酸麻，头昏脑涨。"
  result: "After waking up, your legs and feet feel numb and sore, and your head is spinning."
- raw: "被动技能：进入战斗时，提升自身10%吸血属性。"
  result: "Passive Skill: When entering combat, increases your Lifesteal Attribute by 10%."
- raw: "师傅造的火枪可是能连发三弹，将军……将军亲自赐过名的！"
  result: "The flintlock my master made can fire three shots in a row. The General himself gave it its name!"
- raw: "穆妮曼听闻此言猛地回头，一脸不可置信地看着自家妹妹。你伸手轻拽圣女衣角以作提醒，圣女反手将你手抓来握住，你一时心领神会。"
  result: "Mu Niman whipped her head around at these words and stared in disbelief at her own younger sister. You reached out and tugged lightly at the Saintess's sleeve as a reminder; the Saintess turned her hand and caught yours, holding it, and you understood her meaning at once."
- raw: "父母之仇，不共戴天！将来，我要让那些害我们家破人亡的仇人血债血偿！等报了仇，我一定挣够钱，把阿妹的玉佩赎回来！"
  result: "Vengeance for my parents, we cannot live under the same sky! One day I will make those who ruined our family pay in blood! And once I have avenged them, I will surely earn enough money to buy back my little sister's jade pendant!"
- raw: "先前赌光了田产地契，老婆孩子也跑了，如今光棍一条，全靠这份酒楼生计过活。"
  result: "I gambled away our farmland deeds long ago, and my wife and children ran off. Now I'm all alone, living off this tavern job."
- raw: "勾栏挂靠，伸缩圈点，明心释性，佛念昭然。（影响属性：身法）"
  result: "Hooks, rails and leaning strokes, stretching and circling dots, clearing the mind and understanding one's nature, the Buddha's thought made plain. (Affects Attributes: Agility)"
- raw: "【难觅】效果：下次施展【问秋风】必定获得【萧意】效果，【难觅】持续五秒"
  result: "[Hard to Find] Effect: The next time you use [Asking the Autumn Wind], you will definitely gain the [Xiao Yi] effect; [Hard to Find] lasts five seconds."
- raw: "前往大雪山。（需完成天涯海阁任务[涯阁定谋]）"
  result: "Head to Daxue Mountain. (Requires completing the Tianya Haige task [Settling Plans at Yage])"
- raw: "马踏江湖……杜先生曾是镇国卫的一员？"
  result: "Trampling of the Jianghu... Mr. Du was once a member of the Imperial Guard?"
- raw: "魏无涯，天下人已然身死，朱翊真对我等究竟作何打算，是杀是剐，总归也能说上一说了罢？"
  result: "Wei Wuya, now that Tian Xia Ren is dead, what does Zhu Yizhen intend to do with us? Whether it is the blade or the butcher's knife, he can at least say it, can't he?"
- raw: "总之，此行邀你前来，与此间探花有关。"
  result: "In short, you have been invited here because of the Tanhua of this place."
- raw: "幕后之人爪牙遍布天下，长安探花，便是最好用的鹰犬，我这些时日已然查明，定海石在天涯海阁之处，而不二禅舍利，早在马踏江湖之前便已失落江湖，如今正在探花手中。"
  result: "The mastermind's minions are everywhere under heaven, and the Tanhua of Chang'an are their most useful hounds. In recent days I have established that the Sea-Calming Stone is at Tianya Haige, while the Non-Dual Zen Relic was lost to the Jianghu even before the Trampling of the Jianghu, and is now in the hands of the Tanhua."
- raw: "此间一扇厚重石门，观其图纹样式，竟似是前朝皇寝，只不知是何朝何代，探花能以此为巢，想来其绝非寻常江湖势力……"
  result: "This heavy stone door, judging by its patterns and designs, looks like the imperial burial chamber of a previous dynasty. I don't know which dynasty, but for the Tanhua to make it their lair, they are surely no ordinary Jianghu force......"
- raw: "探花至今已有数百载，有此抱负之人愈发少，打此旗号敛财之人愈发多，这般情景，便是初代探花失算之处了。"
  result: "The title of Tanhua has existed for hundreds of years, and those with such ambitions have become fewer, while those who use it to amass wealth have become more numerous. This situation is precisely where the first Tanhua miscalculated."
- raw: "此话不假，恐怕九品县令，都要比我这探花首脑多些权柄。"
  result: "This is not false; even a ninth-rank county magistrate likely has more authority than I, the head of the Tanhua."
- raw: "芸儿便是当今螣蛇蛊主蒙巳的独女，自幼多得骄纵，聪明伶俐是真，但那股刁钻劲儿……亦非人人都能受得住的。"
  result: "Yun'er is the only daughter of the current Tengshe Gu Master Meng Si. She has been indulged since childhood; she is indeed clever and lively, but her stubborn and mischievous streak... not everyone can handle it."
- raw: "有那倭寇带着，一路上你虽引动不少视线，却也无人相阻，不过多时，他便带你进了安大春先前所说的那处军帐，沿途只见此地守卫森严，人手众多，且兵甲也颇为精良，以朝奉集中的人手想要正面抗衡，想来确是难为。"
  result: "With the Wokou leading you, although you drew many curious glances along the way, no one obstructed your path. It wasn't long before he brought you to the military tent An Dachun had mentioned earlier. Along the way, you noticed that this area was heavily guarded, with numerous soldiers and well-equipped troops, making it difficult for the Chaofeng's forces to mount a direct challenge."
- raw: "壁城水寨上下数十人，高价雇佣探花至此，又复请出墨家机关，方才引得此间骚乱，你等竟……背叛……"
  result: "The Bicheng Water Stronghold hired dozens of people at a high price to bring the Tanhua here, and then they brought out the Mohist mechanisms, causing this commotion. And you... have betrayed them..."
- raw: "“邓真人与探花，竟亦有旧……”"
  result: "Senior Daoist Deng and the Tanhua have a past as well......"
- raw: "你不敌大当家，被其一击震退，颓然跪倒，北豺犹自狂喝着，命令四周匪徒向你围来，他伸手扯住方才挺身救你的毛毛脖颈，指爪用力，咯咯作响。"
  result: "You were no match for the Big Boss, who struck you back with a blow that sent you reeling, and you collapsed to your knees in defeat. The Northern Jackal kept howling, ordering the surrounding bandits to close in on you. He reached out and seized the neck of Maomao, who had just stepped up to save you, and squeezed hard, his claws creaking."
- raw: "崧高维岳，骏极于天，你幼时曾遇一“紫气贵人”，将一册武学秘籍赠交于你，相约日后再会，遂翩然而去。"
  result: "Lofty is Mount Song, soaring to the heavens. When you were young, you met a “Purple Aura Nobleman” who gave you a martial arts manual, promised to meet again someday, and then departed lightly."
- raw: "在下出身姑苏楚家，祖父曾为行伍中人，军效镇国卫，待镇国卫军解伍散军之后便安居家中养老，奈何性如烈火，之前见连环寨贼人夺人财物，便出手教训。"
  result: "I come from the Chu family of Gusu. My grandfather served in the ranks of the Imperial Guard, and after the Imperial Guard was disbanded he settled down at home to live out his years. But his temper is like fire: when he saw Lianhuan Stronghold bandits robbing people of their belongings, he stepped in to teach them a lesson."
- raw: "奇祥异瑞争来送，麟角凤嘴世莫识。"
  result: "Auspicious omens and wondrous signs vie to be delivered; the qilin's horn and the phoenix's beak, none in the world can recognize them."
- raw: "黎大安（尸首）"
  result: "Li Daan (Corpse)"
- raw: "魏无忌并无否认，反倒承认洪帮主看得明白，无论如何，皇帝治下都不许有丐帮这等江湖大派出现，当今帝王所想的，乃是对庙堂、江湖的绝对统治。而洪帮主义薄云天，甘愿以己身性命换得丐帮弟子性命。"
  result: "Wei Wuji did not deny this; instead, he acknowledged that Hong's assessment was accurate. No matter what, the emperor would not tolerate a great Jianghu sect like the Beggar Sect existing under his rule. The current ruler sought absolute control over both the court and Jianghu. Yet Hong, a Sect Leader of boundless righteousness, was willing to sacrifice his own life for the lives of the Beggar Sect Disciples."

