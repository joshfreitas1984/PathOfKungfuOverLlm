- raw: "正是如此，连环寨数百人马虎踞山间，除非不世高手，否则孤身上山，无异自寻死路，然若能自西门家入手，多方求援，做足万全准备，此事……便未必不可为了。"
  result: "Indeed, hundreds of men of Lianhuan Stronghold lie coiled like tigers in the mountains. Unless one is a peerless expert, going up the mountain alone is no different from courting death. But if one could start with the Ximen family, seek help from many quarters and make thorough preparations, this matter... might not be impossible after all."
- raw: "你观察良久，得出结论，应是毛贼在此处销赃，你决定前去探探。"
  result: "You observed for a long time and concluded that the petty thief must be selling stolen goods here. You decide to investigate further."
