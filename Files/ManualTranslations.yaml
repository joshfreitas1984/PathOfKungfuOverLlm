  result: "The great doors of the Blade-Fed Hall were not yet closed. As Yu Hongmei's words had barely fallen, a swirl of white snow and wind suddenly rushed in."
- raw: "你察觉对方顾忌，陡然变招，处处以攻代守，不过数招之下，便将其逼得左支右绌，就连蒙面黑纱，都被劲风击落……"
  result: "You sensed the other's hesitation and abruptly shifted your technique, trading defense for relentless offense. Within mere moves, you forced them into a desperate scramble, even knocking away their black veil with the sheer force of your strikes..."
- raw: "服下此丹之人，丹田内功力顿复，然运功愈猛，内伤愈重，若是全力出手……更是仅死一途。"
  result: "One who takes this pill will instantly recover the power in their dantian. However, the more forcefully they circulate their energy, the more severe their internal injuries become. Should they unleash their full strength... death is the only outcome."
- raw: "几名连环寨暗哨面面相觑，犹豫片刻。"
  result: "Several Lianhuan Stronghold Hidden Sentries exchanged glances, hesitating for a moment."
- raw: "从前只听闻至高功法凶险……未曾想竟是如此骇人……蛊虫一离开身体，寄主就于刹那间重归一捧骸骨……"
  result: "I had only heard that the supreme technique was perilous... I never imagined it would be so terrifying... The moment the gu worm leaves the body, the host crumbles into a pile of bones in an instant..."
- raw: "其余之事小的属实不知……且慢，小的想起来了……我入船场前曾与一名好酒军官相善，那人酒后无意间透露了些许事情……"
  result: "I truly know nothing of the rest... Wait, I remember now... Before I entered the shipyard, I was on good terms with an officer who loved to drink. In a drunken moment, that person inadvertently let slip some details..."
- raw: "哦，<小哥||姑娘>原来是先生故人，今日先生心情不错，你可自去书房，切莫告诉老爷，是在下放<小哥||姑娘>来到，先生若问，你便告诉先生，是顺墙外藤蔓越过假山而入，可明白了？"
  result: "Oh, so <Young Fellow||Miss> is an old acquaintance of the Master. The Master is in a good mood today, so you may go to the study on your own. Do not tell the Lord that I let <Young Fellow||Miss> in. If the Master asks, tell him you climbed over the rockery along the vines outside the wall. Do you understand?"
- raw: "无妨，既然如此，还请<lName><公子||姑娘>先去见过月蟾宫主，她自会替你打理居所，引荐各族……卯雅教务繁忙，若此后想再同<lName><公子||姑娘>说话儿，自会托人相请。"
  result: "No harm done. In that case, please go and meet the Palace Master of Yuechan first, <lName> <Young Master||Young Miss>. She will arrange your quarters and introduce you to the various tribes... Mao Ya is busy with the sect's affairs, but if she wishes to speak with <lName> <Young Master||Young Miss> again later, she will send someone to invite you."

