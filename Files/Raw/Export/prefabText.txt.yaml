- raw: "人行书，曰万灵之长，非有爪牙利齿，亦无皮囊毛铠之防，唯余灵心一点，百道长存，变化万千，探天窥地，夯尽奥妙，自成生灵之首，唯人之道也。"
  splits:
  - text: "人行书，曰万灵之长，非有爪牙利齿，亦无皮囊毛铠之防，唯余灵心一点，百道长存，变化万千，探天窥地，夯尽奥妙，自成生灵之首，唯人之道也。"
- raw: "他拉紧了衣襟，再问，没有回应，那个一直在外面望风的车夫呢？天气实在太冷，他本不想离开这温暖的车厢，可是一个人做了亏心事后，总难免会疑神疑鬼的。他终于穿上靴子，跳下车，四面一片黑暗，寒冷而寂静。那个穿着青布棉袄的车夫，躲在一堆稻草里。"
  splits:
  - text: "他拉紧了衣襟，再问，没有回应，那个一直在外面望风的车夫呢？天气实在太冷，他本不想离开这温暖的车厢，可是一个人做了亏心事后，总难免会疑神疑鬼的。他终于穿上靴子，跳下车，四面一片黑暗，寒冷而寂静。那个穿着青布棉袄的车夫，躲在一堆稻草里。"
