- raw: "尊敬的《刀剑江湖路》用户： \\n欢迎使用由游鲤化龙工作室（以下简称\"我方\"）研发的《刀剑江湖路》单机游戏模组编辑器（以下简称\"本工具\"）。在开始使用本工具前，请仔细阅读本协议全部条款。您对本工具的任何使用行为，即视为已充分阅读、理解并同意接受本协议约束。\\n\\n第一条 内容合规责任 \\n1.1您知悉并确认，本工具不对用户自主导入的第三方内容合法性承担审核责任。您承诺不得通过本工具上传、存储或传播包含以下情形、性质的内容： \\n（1）违反《中华人民共和国宪法》所确立的基本原则的； \\n（2）危害国家安全，泄露国家秘密，颠覆国家政权，破坏国家统一的； \\n（3）损害国家荣誉与利益的； \\n（4）煽动民族仇恨、民族歧视，破坏民族团结的； \\n（5）破坏国家宗教政策，宣扬邪教及封建迷信的； \\n（6）散布谣言，扰乱社会秩序，破坏社会稳定的； \\n（7）含有淫秽、色情、赌博、暴力、凶杀、恐怖或教唆犯罪的； \\n（8）侮辱或诽谤他人，侵害他人合法权益的； \\n（9）传播、教唆使用外挂、私服、病毒、恶意代码、木马及相关内容； \\n（10）侵犯知识产权、商业秘密或其他专有权利的； \\n（11）贬损、诋毁、恶意攻击《刀剑江湖路》游戏软件、服务及相关主体的； \\n（12）其他违反中华人民共和国法律、行政法规及监管规定的。\\n1.2如发现您存在上述违规行为，我方有权单方采取包括但不限于下架、封禁模组的措施，且无需承担事先告知义务。\\n\\n第二条 知识产权承诺 \\n2.1您保证通过本工具导入的全部内容（包括但不限于文字、图像、音视频）均不侵犯第三方知识产权及其他合法权益。如因此引发争议，您应独立承担全部法律责任。\\n\\n第三条 作品传播授权 \\n3.1您通过本工具创作的原创素材，其著作权归属依照《中华人民共和国著作权法》确定。当您选择在网络平台分享作品时： \\n（1）视为授权其他用户非独占性使用权利； \\n（2）理解并接受网络传播的不可控风险； \\n（3）承诺不在公开平台发布任何涉密或敏感内容。\\n3.2任何您不愿被他人获知的内容，都不应在任何网络平台发布或传播。您应严格遵守网络平台规则进行作品的发布、传播、下载，并自行承担相关责任。本工具不介入亦不承担由此产生的任何法律责任。\\n\\n第四条 使用限制条款 \\n4.1《刀剑江湖路》游戏内所有我方原创资源（包括但不限于美术素材、程序代码、音效文件）仅限于游戏本体使用，严禁用于商业用途。\\n\\n4.2 禁止实施以下行为： \\n（1）未经授权盗链本工具内素材资源； \\n（2）仿制、复制其他用户创作的模组作品； \\n（3）将含《刀剑江湖路》游戏元素的模组传播、发布于未经权利人授权的第三方平台。\\n\\n第五条 协议效力声明 \\n5.1本协议最终解释权归游鲤化龙工作室所有。我方保留根据法律法规变化及业务需要修改本协议的权利，修改后的协议将在官方渠道公布后自动生效。\\n\\n\\n\\n\\n\\n  游鲤化龙工作室\\n  2025年02月27日"
