- raw: "《刀剑江湖路》大型DLC《血染黄沙》已经上线！\\n您可以在steam商店把本DLC 添加到库，就可以 免费 获得《血染黄沙》；本DLC引子在京城客栈的旁边，通过场景中可交互的任务地块启动整条 DLC 任务链。\\n\\n我是《刀剑江湖路》的制作人，今天想跟大家聊聊这一年多来的经历，也算是给一直关心这个游戏的玩家们一个交代。\\n关于发行的坎坷\\n这个游戏前后换了三家发行商。EA上线前，第一家突然说自己砍掉了所有单机业务线，我没多说，好聚好散；第二家接手后，正式版上线没多久又说资方要撤资。合同里本来约定按月协商回收预付款、我留一部分用于团队生存，结果对方要求一刀切——先把预付款全部扣完。\\n那段时间，这个游戏的月分成是我唯一的收入来源。我争取过每月少给一点分成，对方没同意。\\n结果就是：整整7个月，我几乎没有一分钱收入。多个贷款逾期，也拖欠了手下兄弟工资，非常对不起这些兄弟，目前还在一点一点的还他们工资，每次有钱入账我都优先还他们的工资再处理我自己的贷款。曾经有一周时间我连着每天吃6个茶叶蛋（真不是段子也不是卖惨，这样我一天只需要9块钱。），我跟老婆笑着说我是在减肥。但游戏没停更，几个兄弟跟我一起咬牙坚持，小更新一直在做但内容确实不多。\\n直到去年12月，预付款终于扣完，每月开始有少量收入进来，我们才缓过一口气，随即投入大型DLC的制作。\\n关于 跑路 的谣言\\n从EA版本起就有人说我跑路，那时候我还能理解——毕竟完整版没出来。但正式版上线之后，50+小时的游玩时长、接近百万字的文案量，依然有人在说跑路，这真的是不合理。如果有人说游戏不好玩我都能理解并接受，也许我的制作能力确实一般，但为何说我跑路？以至于玩家群里戏称我为 百度贴吧每周传奇跑路王 。\\n事实胜于雄辩：正式版上线快一年了，我承诺的大型DLC已经做完，7月27号就会正式上线。\\n关于感谢\\n最难的时候，有游戏群里的玩家兄弟给我转账，有几十，有几百甚至上千。那一刻我明白了一件事：只要你认真做游戏，虽然会有人质疑你、诋毁你，但也一定会有人真心支持你。\\n感谢一直信任我的玩家。DLC见。"
