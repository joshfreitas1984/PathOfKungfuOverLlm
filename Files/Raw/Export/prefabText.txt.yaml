  - subIndex: 128
    text: "好感度判断"
  - subIndex: 129
    text: "当前可以使用此分支节点，以某个"
  - subIndex: 130
    text: "对玩家的好感度为判定条件来开启后续剧情，或分支线路剧情。"
  - subIndex: 131
    text: "交情关系判断"
  - subIndex: 132
    text: "当前可以使用此分支节点，以某个"
  - subIndex: 133
    text: "和玩家所有的关系为判定条件来开启后续剧情，或分支线路剧情。"
  - subIndex: 134
    text: "新增触发器节点状态判断"
  - subIndex: 135
    text: "此触发器会根据玩家编写的剧情与分支节点条件而实时判断任务流程和任务走向。"
  - subIndex: 136
    text: "三．触发器节点新增"
  - subIndex: 137
    text: "支持默认对话，与任务重复触发"
  - subIndex: 138
    text: "当前在未满足玩家所设定的分支条件判断，或回头话设计时，将能够支持给某些角色使用恒定的对话。"
