    text: "可以在系统设置里关闭闪光，震屏等特效。"
- raw: "24,122,你可以参考任务提示的箭头方向来寻找任务地点（箭头会指向任务所在的位置）,Follow the ​​directional quest arrow​​ pointing to your objective."
  splits:
  - split: 2
    text: "你可以参考任务提示的箭头方向来寻找任务地点（箭头会指向任务所在的位置）"
- raw: "25,123,你可以在普通攻击的时候释放技能，来组成不同的连击；还可以通过释放浮空类的技能让连击变的更容易。,\"​​Combo System:​​ Use skills during basic attacks to chain combos; \"\"launcher\"\" skills extend airborne combos easily.\""
  splits:
