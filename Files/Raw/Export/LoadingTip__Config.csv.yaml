    text: "当你连击时，连击数每增加一次，下一次攻击的伤害也增加1%，持续增加伤害到连击数清0为止。"
- raw: "27,125,你可以在系统设置里面打开或者关闭地面网格的开关，分别适合不同习惯的玩家。,Toggle the ground grid display On/Off in System Settings."
  splits:
