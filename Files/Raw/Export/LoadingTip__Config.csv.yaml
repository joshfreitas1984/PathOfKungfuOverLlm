  - split: 2
    template: "{0} "
- raw: "19,117,闪避键可以与方向键一起按，来调整闪避的方向。,Press ​​Directional Keys + [Dodge]​​ to control dodge direction."
  splits:
  - split: 2
    text: "闪避键可以与方向键一起按，来调整闪避的方向。"
- raw: "20,118,要经常注意查看邮件，你的亲友和敌人都有可能通过邮件与你沟通，邮件甚至会触发一些重要的事件。,​​Check Mail regularly!​​ Messages from allies/enemies may trigger critical events."
  splits:
  - split: 2
    text: "要经常注意查看邮件，你的亲友和敌人都有可能通过邮件与你沟通，邮件甚至会触发一些重要的事件。"
- raw: "21,119,你的子女每2年会成长一次，将会有提示让你选择子女的成长方向。,\"Your ​​children age every 2 years​​, prompting choices for their development path.\""
  splits:
  - split: 2
    text: "你的子女每2年会成长一次，将会有提示让你选择子女的成长方向。"
- raw: "22,120,可以在系统设置里选择以下3种操作方式：键鼠操作，纯键盘操作，手柄操作 。,​​Input Methods​​ (System Settings): Keyboard + Mouse / Keyboard-Only / Gamepad."
