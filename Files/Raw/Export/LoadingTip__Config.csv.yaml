    text: "你可以在普通攻击的时候释放技能，来组成不同的连击；还可以通过释放浮空类的技能让连击变的更容易。"
- raw: "26,124,当你连击时，连击数每增加一次，下一次攻击的伤害也增加1%，持续增加伤害到连击数清0为止。,​​Combo Bonus:​​ Each hit increases the next attack’s damage by 1% (resets when combo ends)."
  splits:
