- raw: "3,101,大地图移动时使用【轻功】按键，可跳跃至不易到达的地方。,\"While moving on the world map, press the ​​[Lightness Skill]​​ button to jump to hard-to-reach locations.\""
  splits:
  - split: 2
    text: "大地图移动时使用【轻功】按键，可跳跃至不易到达的地方。"
- raw: "4,102,在非战斗场景中，界面正下方会一直显示玩家所在地块的所有人和物，可以点击交互。,\"In non-combat scenes, all people and objects in the player's current area are displayed at the bottom-center of the interface. Click to interact.\""
  splits:
  - split: 2
    text: "在非战斗场景中，界面正下方会一直显示玩家所在地块的所有人和物，可以点击交互。"
- raw: "5,103,于主界面按下空格键，可查看当前地块内的所有人和物，鼠标左键点击即可交互。,Press the ​​Spacebar​​ on the main interface to see all people and objects in the current area. Left-click to interact."
  splits:
  - split: 2
    text: "于主界面按下空格键，可查看当前地块内的所有人和物，鼠标左键点击即可交互。"
- raw: "6,104,战斗中处于地面受击僵直时，可释放【闪避】脱离僵直状态（江湖路难度需要额外消耗1点真气）。,\"​​During Ground Hitstun (Combat):​​ Press the ​​[Dodge]​​ button to break free (requires 1 additional Qi point on \"\"Jianghu Road\"\" difficulty).\""
  splits:
  - split: 2
    text: "战斗中处于地面受击僵直时，可释放【闪避】脱离僵直状态（江湖路难度需要额外消耗1点真气）。"
- raw: "7,105,战斗中处于地面受击僵直时，或被浮空状态时，可释放【爆气】技能脱离此状态（该技能消耗自身气血值，需注意观察血条）。,​​During Ground Hitstun or Airborne State (Combat):​​ Press the ​​[Qi Burst]​​ skill to escape (consumes HP; monitor health bar)."
  splits:
  - split: 2
    text: "战斗中处于地面受击僵直时，或被浮空状态时，可释放【爆气】技能脱离此状态（该技能消耗自身气血值，需注意观察血条）。"
- raw: "8,106,与开放世界NPC好感度达到50以上，即可邀为同伴，可在战斗配置界面选择同伴上阵参与战斗。,\"When an open-world NPC’s favorability reaches 50+, invite them as a ​​Companion​​. Deploy them in the Battle Setup interface.\""
  splits:
  - split: 2
    text: "与开放世界"
  - split: 2
    subIndex: 1
    text: "好感度达到50以上，即可邀为同伴，可在战斗配置界面选择同伴上阵参与战斗。"
  templates:
  - split: 2
    template: "{0}NPC{1}"
- raw: "9,107,被俘虏的人可被驯化为家仆，可在战斗配置界面选择家仆上阵参与战斗。,Captured enemies can be tamed into ​​Servants​​. Deploy them in the Battle Setup interface."
  splits:
  - split: 2
    text: "被俘虏的人可被驯化为家仆，可在战斗配置界面选择家仆上阵参与战斗。"
- raw: "10,108,点击人物界面左下角的放大镜，可查看人物信息详情，当你决定攻击一个NPC时，最好先确认下对方的实力。,Click the magnifying glass icon at the bottom-left of a character panel to see details. Check an NPC’s strength before attacking."
  splits:
  - split: 2
    text: "点击人物界面左下角的放大镜，可查看人物信息详情，当你决定攻击一个"
  - split: 2
    subIndex: 1
    text: "时，最好先确认下对方的实力。"
  templates:
  - split: 2
    template: "{0}NPC{1}"
- raw: "11,109,部分剧情NPC的特殊任务完成后，便能直接邀请为同伴，可在战斗配置界面选择同伴上阵参与战斗。,Complete special quests for story NPCs to directly invite them as ​​Companions​​. Deploy them in Battle Setup."
  splits:
  - split: 2
    text: "部分剧情"
  - split: 2
    subIndex: 1
    text: "的特殊任务完成后，便能直接邀请为同伴，可在战斗配置界面选择同伴上阵参与战斗。"
  templates:
  - split: 2
    template: "{0}NPC{1}"
- raw: "12,110,感到战力不足时，可选择解锁经脉，提升内功境界，更换装备等手段提升战力。,\"If underpowered: Unlock Meridians, advance your Inner Force Realm, upgrade equipment, etc.\""
  splits:
  - split: 2
    text: "感到战力不足时，可选择解锁经脉，提升内功境界，更换装备等手段提升战力。"
- raw: "13,111,野外敌人每隔一段时间便会刷新，可前往挑战他们获取武学装备。,Enemies in the wild respawn periodically. Defeat them to obtain martial arts manuals and gear."
  splits:
  - split: 2
    text: "野外敌人每隔一段时间便会刷新，可前往挑战他们获取武学装备。"
- raw: "14,112,提升内功境界时，会额外获得属性点，记得在个人属性界面加点以提升人物战斗能力。,Advancing your Inner Force Realm grants bonus attribute points. Allocate them in the Character Attributes menu."
  splits:
  - split: 2
    text: "提升内功境界时，会额外获得属性点，记得在个人属性界面加点以提升人物战斗能力。"
- raw: "15,113,可以在任务界面打开或者关闭任务追踪（最多可同时跟踪3个任务）。,Enable/disable quest tracking (up to 3 concurrently) in the Quests interface."
  splits:
  - split: 2
    text: "可以在任务界面打开或者关闭任务追踪（最多可同时跟踪3个任务）。"
- raw: "16,114,可以通过滚动鼠标滚轮，放大或者缩小视野范围。,Zoom in/out using the mouse scroll wheel."
  splits:
  - split: 2
    text: "可以通过滚动鼠标滚轮，放大或者缩小视野范围。"
- raw: "17,115,当某个经脉的所有穴位完成冲穴时，你会自动贯通所有穴位并获得额外奖励。,Fully unlocking all acupoints in a Meridian grants an automatic bonus reward."
  splits:
  - split: 2
    text: "当某个经脉的所有穴位完成冲穴时，你会自动贯通所有穴位并获得额外奖励。"
- raw: "18,116,你不需要向剧情同伴支付薪水，但需要向开放世界里的同伴与家仆支付薪水，欠薪会降低关系。 ,​​No salary​​ for story Companions. ​​Open-world Companions/Servants require payment​​; unpaid wages lower relationship."
  splits:
  - split: 2
    text: "你不需要向剧情同伴支付薪水，但需要向开放世界里的同伴与家仆支付薪水，欠薪会降低关系。"
