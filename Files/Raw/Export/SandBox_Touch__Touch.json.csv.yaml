- raw: "960,11000002,15,[0].talks{json}[0].talk,江湖前客江怀楚，昔日天涯海阁客卿，曾创清风剑法存世，神狩七年，刺杀镇国公不成，为杜颜白领镇国卫所杀，遵其遗愿，送还青萍村，另有石书一册，怜其所行虽偏激但仍属正直，故不予损毁，同葬于此。——书碑者，杜颜白。"
  splits:
  - split: 4
    text: "江湖前客江怀楚，昔日天涯海阁客卿，曾创清风剑法存世，神狩七年，刺杀镇国公不成，为杜颜白领镇国卫所杀，遵其遗愿，送还青萍村，另有石书一册，怜其所行虽偏激但仍属正直，故不予损毁，同葬于此。——书碑者，杜颜白。"
- raw: "961,11000003,15,[0].talks{json}[0].talk,临行之言，后来者知之：江某本流落遗孤，于青萍村内，得百家相助活命，后与左三思相交，为天涯海阁客卿。"
  splits:
  - split: 4
    text: "临行之言，后来者知之"
  - split: 4
    subIndex: 1
    text: "江某本流落遗孤，于青萍村内，得百家相助活命，后与左三思相交，为天涯海阁客卿。"
  templates:
  - split: 4
    template: "{0}：{1}"
- raw: "961,11000003,15,[0].talks{json}[1].talk,后因“马踏江湖”一事就此脱离江湖，不料回返之际，亦发现村内被镇国卫波及，满村上下无一活口。"
  splits:
  - split: 4
    text: "后因“马踏江湖”一事就此脱离江湖，不料回返之际，亦发现村内被镇国卫波及，满村上下无一活口。"
- raw: "961,11000003,15,[0].talks{json}[2].talk,江某深恩未报，决意留著书《清风剑法》，以待后人，即刻动身讨寻青萍村乡亲血债，今日立书于此，誓灭镇国卫，誓杀镇国公！"
  splits:
  - split: 4
    text: "江某深恩未报，决意留著书《清风剑法》，以待后人，即刻动身讨寻青萍村乡亲血债，今日立书于此，誓灭镇国卫，誓杀镇国公！"
- raw: "961,11000003,15,[0].talks{json}[2].options{json}[0].name,杜颜白……镇国卫？镇国公？"
  splits:
  - split: 4
    text: "杜颜白……镇国卫？镇国公？"
