- raw: "1297,12000006,15,[0].talks{json}[1].talk,李氏不肖子孙，行走江湖十载，不甘庸碌此生，忤逆宗训，开启李氏太公承安之墓，寻先祖神兵秘籍以壮己身。\\n今日得见先祖墓内唯有农锄一柄，方知先祖功绩是真，却无神功利器傍身。\\n顿悟侠之一字，非在剑之利，非在功之高，仅存侠者仁心一念之间。"
  splits:
  - split: 4
    text: "李氏不肖子孙，行走江湖十载，不甘庸碌此生，忤逆宗训，开启李氏太公承安之墓，寻先祖神兵秘籍以壮己身。"
  - split: 4
