- raw: "961,11000003,15,[0].talks{json}[3].talk,传闻二十年前，朝堂之上江湖，以镇国公为首，创立镇国卫，监察四方，更以战阵之势，将江湖各门派压得抬不起头，杜先生曾经……便是传闻中的镇国卫吗？"
  splits:
  - split: 4
    text: "传闻二十年前，朝堂之上江湖，以镇国公为首，创立镇国卫，监察四方，更以战阵之势，将江湖各门派压得抬不起头，杜先生曾经……便是传闻中的镇国卫吗？"
- raw: "961,11000003,15,[0].talks{json}[4].talk,既然青萍村中已应再无活口，现下村中的百姓，却是从何而来……何况村长将众人禁锢在此地不容外出，未曾听闻有什么村庄比这更古怪了……"
  splits:
  - split: 4
    text: "既然青萍村中已应再无活口，现下村中的百姓，却是从何而来……何况村长将众人禁锢在此地不容外出，未曾听闻有什么村庄比这更古怪了……"
- raw: "961,11000003,15,[0].talks{json}[5].talk,你向下方那册矮矮的石书看去，其上图案文字隐隐为一套剑法招式的总纲心决，只是年久模糊已多有破损，若能寻来纸墨拓印或还能一阅。"
