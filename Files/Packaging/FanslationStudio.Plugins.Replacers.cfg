[DynamicStringPatcher]

## Replace hardcoded strings in the game's code, using the translated dynamic string files
# Setting type: Boolean
# Default value: false
Enabled = true

## Folder (relative to BepInEx/) containing the translated dynamic string files
# Setting type: String
# Default value: ./english
ResourcePath = ./plugins/resources

## Translated dynamic string files to load from ResourcePath (* matches anything, case is ignored). Every match is loaded, alphabetically; later files win
# Setting type: String
# Default value: *dynamicStrings*
FilePattern = *dynamicStrings*

## When a generic method can't be patched, patch it closed over its class constraint or object instead (covers reference-type instantiations). Experimental
# Setting type: Boolean
# Default value: false
ClosedGenericFallback = true

[PrefabTextReplacer]

## Replace text that is hardcoded in prefabs, using the translated prefab text files
# Setting type: Boolean
# Default value: false
Enabled = true

## Folder (relative to BepInEx/) containing the translated prefab text files
# Setting type: String
# Default value: ./english
ResourcePath = ./plugins/resources

## Translated prefab text files to load from ResourcePath (* matches anything, case is ignored). Every match is loaded, alphabetically; later files win
# Setting type: String
# Default value: *prefabText*
FilePattern = *prefabText*
