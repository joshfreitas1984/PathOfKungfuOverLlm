- raw: "3,1,武力,影响外功攻击力，武学伤害。,"
  splits:
  - split: 2
    text: "武力"
    translated: "Might"
  - split: 3
    text: "影响外功攻击力，武学伤害。"
    translated: "Affects External Attack Power, Martial Art Damage"
- raw: "4,2,筋骨,影响外功防御力，气血上限，免暴，武学伤害。,"
  splits:
  - split: 2
    text: "筋骨"
    translated: "Physique"
  - split: 3
    text: "影响外功防御力，气血上限，免暴，武学伤害。"
    translated: "Affects External Defense, Max Lifeforce, Crit Immunity, and Martial Art Damage."
- raw: "5,3,身法,影响移动速度，暴击几率，暴击伤害，武学伤害。,"
  splits:
  - split: 2
    text: "身法"
    translated: "Agility"
  - split: 3
    text: "影响移动速度，暴击几率，暴击伤害，武学伤害。"
    translated: "Affects Movement Speed, Critical Hit Chance, Crit Damage, and Martial Art Damage."
- raw: "6,4,内息,影响内功攻击力，内功防御力，武学伤害。,"
  splits:
  - split: 2
    text: "内息"
    translated: "Inner Qi"
  - split: 3
    text: "影响内功攻击力，内功防御力，武学伤害。"
    translated: "Affects Internal Attack Power, Internal Defense, and Martial Art Damage."
- raw: "7,5,悟性,影响偷学与请教武学的成功率，试探对方境界，增加修为获取速度，开启三才书槽位。,"
  splits:
  - split: 2
    text: "悟性"
    translated: "Comprehension"
  - split: 3
    text: "影响偷学与请教武学的成功率，试探对方境界，增加修为获取速度，开启三才书槽位。"
    translated: "Affects the success rate of secretly learning and seeking guidance in martial arts, tests the other party's realm, increases the speed of cultivation gain, and unlocks slots for the Three Talents Tome."
