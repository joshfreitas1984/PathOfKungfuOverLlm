- raw: "9,20001,2,请求东西,{0}：朋友身上这件宝贝恰是在下苦求难得之物，不知是否可以慷慨相赠。,{0}听了你的请求，稍微犹豫了一会,{0}：这本是我颇费周折得来之物，不过既然是朋友想要，自然不该吝啬，你拿去便是了。,{0}：实不相瞒，这东西正是我眼下当用之物，确实不方便赠予阁下，还请见谅,0,0"
