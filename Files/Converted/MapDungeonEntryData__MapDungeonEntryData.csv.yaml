- raw: "9,7,副本 大名府邸,\"1000048,1000049,1000050\",贵族家宅,11000994,27000,\"20,41\",副本·大名府邸,东瀛大名贼心不死，勾结沿海奸商走私兵器，豢养忍者、死士，更以活人试刀残杀百姓，意图积蓄势力，再侵中原。若能捣毁倭贼巢穴，可断东瀛染指中原之野心。"
  splits:
  - split: 4
