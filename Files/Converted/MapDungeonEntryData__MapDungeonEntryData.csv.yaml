    translated: "Taohua Dock is the most renowned pleasure quarter in the realm, attracting many distinguished guests of high rank and status. Xiaoxiangzi leverages these connections to wield influence and wreak havoc upon the region. Eliminating this threat would surely benefit the common people and uphold the path of chivalry."
