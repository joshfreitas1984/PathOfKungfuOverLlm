- raw: "5,3,副本 桃花坞,\"1000013,1000021,1000022\",寝宫入口,1190001057,19000,\"37,37\",副本·潇湘寝宫,桃花坞乃天下首屈一指的温柔乡，往来宾客中不乏达官显贵，潇湘子籍此长袖善舞，为祸一方。若能除去此害，定能造福百姓，以贯侠道。"
