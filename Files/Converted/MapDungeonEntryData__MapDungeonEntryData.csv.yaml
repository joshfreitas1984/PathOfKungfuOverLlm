    text: "女真岗哨"
    translated: "Jurchen sentry"
  - split: 9
    text: "近岁辽东女真频频南侵，此次进犯，虽以瓦尔喀部为主力，却也有余部在旁策应，占据燕山山口要道，以为犄角之势。若能拔除此寨，便可削去女真爪牙，为隋东关除去一心头之患。"
    translated: "In recent years, the Jurchen of Liaodong have repeatedly invaded from the south. Although the Warkha tribe forms the main force in this incursion, other tribes are providing support, occupying key passes in the Yanshan Mountains to create a pincer formation. If we can destroy this fortress, we will cut off the Jurchen's claws and remove a persistent threat to Suidong Pass."
  templates:
  - split: 8
    template: "{0}·{1}"
