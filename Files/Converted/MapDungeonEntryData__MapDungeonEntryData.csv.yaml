  - split: 9
    text: "连环寨盘踞承安多年，横行霸道，鱼肉乡里，堪称无恶不作，如今贼首尽皆藏身内寨之中，正是将其一网打尽的千载良机……"
    translated: "Lianhuan Stronghold has held sway over Cheng'an for years, running rampant and terrorizing the locals, committing every conceivable crime. Now that all the bandit leaders are holed up in the inner stronghold, this is a once-in-a-lifetime chance to wipe them all out..."
