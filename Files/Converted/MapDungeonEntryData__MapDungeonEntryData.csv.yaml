- raw: "6,4,副本 长安古陵,\"1000028,1000029,1000030\",古陵墓门,11000921,21000,\"42,48\",副本·长安古陵,长安之地乃旧朝都城所在，历朝于此大修陵寝，斗转星移，或有陵墓重现天日，然长安已物是人非。而今探花组织将其作为据点，杀人买命，若能清剿此处，便可为江湖除去一凶……"
  splits:
  - split: 4
    text: "古陵墓门"
    translated: "Ancient Tomb Door"
  - split: 8
    text: "副本"
