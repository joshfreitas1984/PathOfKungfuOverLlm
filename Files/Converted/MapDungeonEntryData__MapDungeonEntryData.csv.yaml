    text: "长安古陵"
    translated: "Ancient Tombs of Chang'an"
  - split: 9
    text: "长安之地乃旧朝都城所在，历朝于此大修陵寝，斗转星移，或有陵墓重现天日，然长安已物是人非。而今探花组织将其作为据点，杀人买命，若能清剿此处，便可为江湖除去一凶……"
    translated: "Chang'an was the capital of the former dynasty. Over successive reigns, grand mausoleums were constructed here. As time passed and stars shifted, some tombs have resurfaced, yet Chang'an is now a place where things remain but people are gone. Today, the Tanhua organization has established an outpost here, trading in murder for survival. If we can purge this location, we shall rid the Jianghu of one great evil..."
