    text: "大名府邸"
    translated: "Daming Manor"
  - split: 9
    text: "东瀛大名贼心不死，勾结沿海奸商走私兵器，豢养忍者、死士，更以活人试刀残杀百姓，意图积蓄势力，再侵中原。若能捣毁倭贼巢穴，可断东瀛染指中原之野心。"
    translated: "The Japanese Daimyo's wicked ambitions remain undimmed. He colludes with corrupt merchants along the coast to smuggle weapons, harbors ninjas and death warriors, and even tests blades on living humans, massacring the populace. His intent is to amass power and invade the Central Plains once more. If we can destroy the nest of these Japanese bandits, we can crush Japan's ambitions to meddle in the Central Plains."
