    translated: "Purifying Toad Demon Heaven Pool"
  - split: 9
    text: "净蛊天池千百年来皆是五圣禁地，其中藏有无数不可见世的至深隐秘。如今一干五圣叛党为求秘宝闯入其中，若不将其拦阻而下，恐怕天下万民，皆有倒悬之虞……"
    translated: "The Pure Gu Tianchi has been a forbidden ground of the Five Sages for thousands of years, concealing countless profound secrets that must never be revealed to the world. Now, a group of traitors among the Five Sages have breached it in search of secret treasures. If we do not stop them, the entire realm and its people may face imminent peril..."
  templates:
