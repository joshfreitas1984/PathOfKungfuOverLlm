  - split: 9
    text: "紫禁城深处宫阙，为伪帝占据，豢养鹰犬。其妄图勾结北狄势力篡权，此刻禁宫深处杀机四伏，若能冲破防线、斩杀伪帝，应可重振天朝纲纪。"
    translated: "Deep within the Forbidden City, the False Emperor has seized the palace and bred a pack of loyal hounds. He schemes to collude with the Northern Di tribes to usurp power. At this moment, lethal danger lurks in every corner of the inner palace. If we can breach his defenses and slay the False Emperor, we may restore order to the Celestial Dynasty."
