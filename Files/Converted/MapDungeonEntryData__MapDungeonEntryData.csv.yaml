  - split: 9
    text: "壁城水寨垄断东南水运、海运多年，独霸漕运、纵横绿林。如今，有一伙狠厉水贼便盘踞于窝点之中，若能将之剿除，便可还一方水道安宁。"
    translated: "The Bicheng Water Stronghold has monopolized the southeast waterways for years, dominating maritime trade and the canal transport system, while also exerting influence over the outlaw bands. Currently, a ruthless gang of Water Bandits is entrenched in their hideout. If they can be eradicated, peace will be restored to these waterways."
