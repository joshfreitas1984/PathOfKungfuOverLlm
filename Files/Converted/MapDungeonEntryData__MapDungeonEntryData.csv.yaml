- raw: "3,1,副本 连环寨,\"1000002,1000017,1000018\",内寨大门,11000812,13030,\"20,23\",副本·连环寨,连环寨盘踞承安多年，横行霸道，鱼肉乡里，堪称无恶不作，如今贼首尽皆藏身内寨之中，正是将其一网打尽的千载良机……"
