    template: "{0}·{1}"
- raw: "7,5,副本 女真岗哨,\"1000031,1000032,1000033\",岗哨寨门,11000922,22010,\"44,38\",副本·女真岗哨,近岁辽东女真频频南侵，此次进犯，虽以瓦尔喀部为主力，却也有余部在旁策应，占据燕山山口要道，以为犄角之势。若能拔除此寨，便可削去女真爪牙，为隋东关除去一心头之患。"
  splits:
  - split: 4
    text: "岗哨寨门"
    translated: "Sentry Stronghold Gate"
  - split: 8
