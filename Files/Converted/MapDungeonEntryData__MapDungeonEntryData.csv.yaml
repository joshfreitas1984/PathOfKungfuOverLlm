- raw: "4,2,副本 净蛊天池,\"1000012,1000019,1000020\",天池小舟,11000813,18000,\"4,46\",副本·净蛊天池,净蛊天池千百年来皆是五圣禁地，其中藏有无数不可见世的至深隐秘。如今一干五圣叛党为求秘宝闯入其中，若不将其拦阻而下，恐怕天下万民，皆有倒悬之虞……"
  splits:
