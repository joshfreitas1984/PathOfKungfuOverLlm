- raw: "UIWuXueNew,InitHelpInfo,186,江湖散学是各类武器的普通攻击，重击，格挡，跳跃，弹反等等。\\n\\n当你切换武器类型的时候，会自动切换到对应武器种类的江湖散学。\\n\\n可以在各地武馆购买学习。,[]"
  splits:
  - split: 3
    text: "江湖散学是各类武器的普通攻击，重击，格挡，跳跃，弹反等等。\\n\\n当你切换武器类型的时候，会自动切换到对应武器种类的江湖散学。\\n\\n可以在各地武馆购买学习。"
    translated: "Jianghu Miscellaneous Art is the normal attack, heavy attack, block, jump, parry, etc. for each weapon type.\\n\\nWhen you switch weapon types, you automatically switch to the Jianghu Miscellaneous Art for that weapon type.\\n\\nYou can buy and learn it at Martial Arts Halls in various locations."
- raw: "UIWuXueNew,InitHelpInfo,231,江湖通式是各类武器的通用技能，不消耗真气而是消耗体力使用的技能，一般是浮空技或者位移技，可以强制中断当前的普通攻击释放。\\n\\n当你切换武器类型的时候，会自动切换到对应武器种类的江湖通式。\\n\\n可以在各地武馆购买学习。,[]"
  splits:
  - split: 3
    text: "江湖通式是各类武器的通用技能，不消耗真气而是消耗体力使用的技能，一般是浮空技或者位移技，可以强制中断当前的普通攻击释放。\\n\\n当你切换武器类型的时候，会自动切换到对应武器种类的江湖通式。\\n\\n可以在各地武馆购买学习。"
    translated: "The Jianghu Common Form is a universal skill for various weapons.\\n\\nIt does not consume True Qi but instead uses Stamina. These skills are typically aerial techniques or movement skills and can forcibly interrupt your current normal attack to be released.\\n\\nWhen you switch weapon types, it will automatically switch to the corresponding Jianghu Common Form for that weapon type.\\n\\nYou can purchase and learn them at martial arts halls in various locations."
- raw: "UIWuXueNew,InitHelpInfo,277,武学研本是各类武器的高级技能以及内功轻功，需要消耗真气使用的技能，可以强制中断当前的普通攻击释放。\\n\\n当你切换武器类型的时候，需要手动切换武学研本的技能（点击当前武学的书本图标切换）。\\n\\n通过任务获取，或者从NPC身上获取。,[]"
  splits:
  - split: 3
    text: "武学研本是各类武器的高级技能以及内功轻功，需要消耗真气使用的技能，可以强制中断当前的普通攻击释放。\\n\\n当你切换武器类型的时候，需要手动切换武学研本的技能（点击当前武学的书本图标切换）。\\n\\n通过任务获取，或者从NPC身上获取。"
    translated: "Wuyan techniques are advanced skills for various weapons, as well as Neigong and Qinggong. These skills require the consumption of True Qi and can forcibly interrupt your current Normal attacks to be released.\\n\\nWhen you switch weapon types, you need to manually switch the Wuyan technique (click on the book icon of the current Wuyan technique to switch).\\n\\nYou can obtain them through quests or from NPCs."
