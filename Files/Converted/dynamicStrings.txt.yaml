- raw: "UI_WulinReady,Start,119,<b>1.举办时间段</b>\\r\\n每年1月初 - 3月底\\r\\n\\r\\n<b>2.比赛轮次</b>\\r\\n共五轮，依次角逐出十六强-八强-四强-半区魁首-武林盟主！\\r\\n\\r\\n<b>3.武斗排名奖励</b>\\r\\n武林盟主\\r\\n奖励：\"武斗桂冠\"*1+珍稀道具*3+声望+银两\\r\\n\\r\\n半区魁首\\r\\n奖励：\"武斗之魂\"*1+珍稀道具*2+声望+银两\\r\\n\\r\\n四强\\r\\n奖励：\"武斗精意\"*1+珍稀道具*1+声望+银两\\r\\n\\r\\n八强\\r\\n奖励：\"武斗印记\"*1+声望+银两\\r\\n\\r\\n十六强\\r\\n奖励：声望+银两\\r\\n\\r\\n未入围&未参赛\\r\\n无奖励,[]"
  splits:
  - split: 3
    text: "<b>1.举办时间段</b>\\r\\n每年1月初 - 3月底\\r\\n\\r\\n<b>2.比赛轮次</b>\\r\\n共五轮，依次角逐出十六强-八强-四强-半区魁首-武林盟主！\\r\\n\\r\\n<b>3.武斗排名奖励</b>\\r\\n武林盟主\\r\\n奖励：\"武斗桂冠\"*1+珍稀道具*3+声望+银两\\r\\n\\r\\n半区魁首\\r\\n奖励：\"武斗之魂\"*1+珍稀道具*2+声望+银两\\r\\n\\r\\n四强\\r\\n奖励：\"武斗精意\"*1+珍稀道具*1+声望+银两\\r\\n\\r\\n八强\\r\\n奖励：\"武斗印记\"*1+声望+银两\\r\\n\\r\\n十六强\\r\\n奖励：声望+银两\\r\\n\\r\\n未入围&未参赛\\r\\n无奖励"
    translated: "<b>1. Event Period</b>\\r\\nFrom early 1 to late 3\\r\\n\\r\\n<b>2. Competition Rounds</b>\\r\\nFive rounds, successively determining the top sixteen - top eight - top four - semi-final champions - Wulin Alliance Leader!\\r\\n\\r\\n<b>3. Martial Combat Rankings Rewards</b>\\r\\nWulin Alliance Leader\\r\\nReward: \"Martial Combat Laurels\" *1 + rare items *3 + Reputation + Silver\\r\\n\\r\\nSemi-Final Champion\\r\\nReward: \"Soul of Martial Combat\" *1 + rare items *2 + Reputation + Silver\\r\\n\\r\\nTop Four\\r\\nReward: \"Martial Combat Essence\" *1 + rare items *1 + Reputation + Silver\\r\\n\\r\\nTop Eight\\r\\nReward: \"Martial Combat Mark\" *1 + Reputation + Silver\\r\\n\\r\\nTop Sixteen\\r\\nReward: Reputation + Silver\\r\\n\\r\\nDid Not Qualify & Did Not Participate\\r\\nNo Reward"
    qcReviewedText: "<b>1. Event Period</b>\\r\\nFrom early 1 to late 3\\r\\n\\r\\n<b>2. Competition Rounds</b>\\r\\nFive rounds, successively determining the top sixteen - top eight - top four - semi-final champions - Wulin Alliance Leader!\\r\\n\\r\\n<b>3. Martial Combat Rankings Rewards</b>\\r\\nWulin Alliance Leader\\r\\nReward: \"Martial Combat Laurels\" *1 + rare items *3 + Reputation + Silver\\r\\n\\r\\nSemi-Final Champion\\r\\nReward: \"Soul of Martial Combat\" *1 + rare items *2 + Reputation + Silver\\r\\n\\r\\nTop Four\\r\\nReward: \"Martial Combat Essence\" *1 + rare items *1 + Reputation + Silver\\r\\n\\r\\nTop Eight\\r\\nReward: \"Martial Combat Mark\" *1 + Reputation + Silver\\r\\n\\r\\nTop Sixteen\\r\\nReward: Reputation + Silver\\r\\n\\r\\nDid Not Qualify & Did Not Participate\\r\\nNo Reward"
