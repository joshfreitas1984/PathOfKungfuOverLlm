    text: "我祖父怎会被这些宵小所伤？只是那些小人当真无耻，待祖父出手教训后便一直怀恨于心，终于被他们得了机会。"
    translated: "How could my grandfather be hurt by such scoundrels? Those cowards were truly shameless; after my grandfather taught them a lesson, they harbored resentment and finally had their chance."
