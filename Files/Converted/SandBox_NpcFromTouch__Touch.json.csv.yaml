- raw: "22,1120001004,10,[0].talks{json}[4].talk,十几日后，连环寨贼人窥得家中众人不在，突入家中，暗害祖父，祖父虽将诸多小人击退，却亦被他们夺去了家传之剑，祖父气火攻心，卧病在床，我又怎能不出手来寻这连环寨讨个公道！"
  splits:
  - split: 4
    text: "十几日后，连环寨贼人窥得家中众人不在，突入家中，暗害祖父，祖父虽将诸多小人击退，却亦被他们夺去了家传之剑，祖父气火攻心，卧病在床，我又怎能不出手来寻这连环寨讨个公道！"
    translated: "A few days later, the bandits from Lianhuan Stronghold learned that everyone was away and suddenly entered our home, secretly harming my grandfather. Although he drove many of them back, they still managed to take our family sword. Overwhelmed with anger and grief, my grandfather fell ill in bed. How could I not act to seek justice from Lianhuan Stronghold?"
