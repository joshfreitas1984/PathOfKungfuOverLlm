- raw: "22,1120001004,10,[0].talks{json}[2].talk,在下出身姑苏楚家，祖父曾为行伍中人，军效镇国卫，待镇国卫军解伍散军之后便安居家中养老，奈何性如烈火，之前见连环寨贼人夺人财物，便出手教训。"
  splits:
  - split: 4
    text: "在下出身姑苏楚家，祖父曾为行伍中人，军效镇国卫，待镇国卫军解伍散军之后便安居家中养老，奈何性如烈火，之前见连环寨贼人夺人财物，便出手教训。"
- raw: "22,1120001004,10,[0].talks{json}[2].options{json}[0].name,“老先生可是因此负伤？”。"
