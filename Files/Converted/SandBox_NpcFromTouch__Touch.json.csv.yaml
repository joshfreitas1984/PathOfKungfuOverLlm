- raw: "22,1120001004,10,[0].talks{json}[3].talk,我祖父怎会被这些宵小所伤？只是那些小人当真无耻，待祖父出手教训后便一直怀恨于心，终于被他们得了机会。"
  splits:
  - split: 4
    text: "我祖父怎会被这些宵小所伤？只是那些小人当真无耻，待祖父出手教训后便一直怀恨于心，终于被他们得了机会。"
- raw: "22,1120001004,10,[0].talks{json}[4].name,楚林灵"
  splits:
  - split: 4
    text: "楚林灵"
- raw: "22,1120001004,10,[0].talks{json}[4].talk,十几日后，连环寨贼人窥得家中众人不在，突入家中，暗害祖父，祖父虽将诸多小人击退，却亦被他们夺去了家传之剑，祖父气火攻心，卧病在床，我又怎能不出手来寻这连环寨讨个公道！"
  splits:
  - split: 4
    text: "十几日后，连环寨贼人窥得家中众人不在，突入家中，暗害祖父，祖父虽将诸多小人击退，却亦被他们夺去了家传之剑，祖父气火攻心，卧病在床，我又怎能不出手来寻这连环寨讨个公道！"
