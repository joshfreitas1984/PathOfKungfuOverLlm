- raw: "22,1120001004,10,[0].talks{json}[5].talk,近来数月，我一直在追索连环寨的踪迹，查到那连环寨曾取得一批火油柴薪，此时还未至寒冬冷月，取此物除了杀人放火，又是何故？"
  splits:
  - split: 4
    text: "近来数月，我一直在追索连环寨的踪迹，查到那连环寨曾取得一批火油柴薪，此时还未至寒冬冷月，取此物除了杀人放火，又是何故？"
