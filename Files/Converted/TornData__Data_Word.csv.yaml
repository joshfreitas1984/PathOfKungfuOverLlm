- raw: "732,730,武学界面-问号,江湖通式是各类武器的通用技能，不消耗真气而是消耗体力使用的技能一般是浮空技或者位移技，可以强制中断当前的普通攻击释放。\\n当你切换武器类型的时候，会自动切换到对应武器种类的江湖通式。\\n可以在各地武馆购买学习。"
