- raw: "883,881,版本更新,天行书，曰君子自强，虽百屈而不饶者，方可领会其真意，若天赋寰宇，其势不可挡，不可转，不可折，不可逆，不可滞，至刚至强，乃为天道。"
  splits:
  - split: 3
    text: "天行书，曰君子自强，虽百屈而不饶者，方可领会其真意，若天赋寰宇，其势不可挡，不可转，不可折，不可逆，不可滞，至刚至强，乃为天道。"
    translated: "Heavenly path, it says, the gentleman strives on his own, even bending a hundred times, he will not yield. Only then can one grasp its true meaning. If endowed with talent that spans the universe, its force is unstoppable, unturnable, unbreakable, irreversible, utmost in strength and might-it is the Heavenly path."
- raw: "884,882,版本更新,地行书，曰厚德载物，夫万载不朽，唯不争之胜可为广博，如岳如渊，垂黄土以化众生，其势固，无可灭者，其形博，以养众生，此为地之道。"
  splits:
  - split: 3
    text: "地行书，曰厚德载物，夫万载不朽，唯不争之胜可为广博，如岳如渊，垂黄土以化众生，其势固，无可灭者，其形博，以养众生，此为地之道。"
    translated: "The Way of the Earth Scripture states: Virtue bears all things. Only through non-contention can one achieve greatness and longevity, like a mountain or a deep abyss, nurturing all beings with the yellow earth. Its power is unbreakable, and its form vast, sustaining all life. This is the path of the earth."
- raw: "885,883,版本更新,人行书，曰万灵之长，非有爪牙利齿，亦无皮囊毛铠之防，唯余灵心一点，百道长存，变化万千，探天窥地，夯尽奥妙，自成生灵之首，唯人之道也。"
  splits:
  - split: 3
    text: "人行书，曰万灵之长，非有爪牙利齿，亦无皮囊毛铠之防，唯余灵心一点，百道长存，变化万千，探天窥地，夯尽奥妙，自成生灵之首，唯人之道也。"
    translated: "Humans write their own destiny, the masters of all spirits. Without sharp claws or fangs, without scales or fur for armor, they possess but a single point of spirit, yet a myriad of Daoists endure, transforming endlessly, exploring the heavens and delving into the earth, mastering all wonders, thus becoming the pinnacle of life, the way of humanity alone."
