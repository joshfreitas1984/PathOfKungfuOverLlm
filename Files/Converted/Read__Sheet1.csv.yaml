- raw: "5,940004,1,子曰：“学而时习之，不亦说乎？有朋自远方来，不亦乐乎？人不知而不愠，不亦君子乎？”\\n\\n有子曰：“其为人也孝弟，而好犯上者，鲜矣；不好犯上而好作乱者，未之有也。君子务本，本立而道生。孝弟也者，其为仁之本与！”\\n\\n子曰：“巧言令色，鲜矣仁！”\\n\\n曾子曰：“吾日三省吾身：为人谋而不忠乎？与朋友交而不信乎？传不习乎？”\\n\\n子曰：“道千乘之国，敬事而信，节用而爱人，使民以时。”\\n\\n子曰：“弟子入则孝，出则弟，谨而信，泛爱众，而亲仁，行有余力，则以学文。”\\n\\n子夏曰：“贤贤易色；事父母，能竭其力；事君，能致其身；与朋友交，言而有信。虽曰未学，吾必谓之学矣。”\\n\\n子曰：“君子不重则不威，学则不固。主忠信，无友不如己者，过，则勿惮改。”\\n\\n曾子曰：“慎终追远，民德归厚矣。”\\n\\n子禽问于子贡曰：“夫子至于是邦也，必闻其政，求之与，抑与之与？”子贡曰：“夫子温、良、恭、俭、让以得之。夫子之求之也，其诸异乎人之求之与？”\\n\\n子曰：“父在，观其志；父没，观其行；三年无改于父之道，可谓孝矣。”\\n\\n有子曰：“礼之用，和为贵。先王之道，斯为美，小大由之。有所不行，知和而和，不以礼节之，亦不可行也。”\\n\\n有子曰：“信近于义，言可复也。恭近于礼，远耻辱也。因不失其亲，亦可宗也。”\\n\\n子曰：“君子食无求饱，居无求安，敏于事而慎于言，就有道而正焉。可谓好学也已。”\\n\\n子贡曰：“贫而无谄，富而无骄，何如？”子曰：“可也。未若贫而乐，富而好礼者也。”子贡曰：“《诗》云：‘如切如磋，如琢如磨’，其斯之谓与？”子曰：“赐也，始可与言《诗》已矣，告诸往而知来者。”\\n\\n子曰：“不患人之不己知，患不知人也。”,,,,,"
  splits:
  - split: 3
    text: "子曰"
    translated: "Master said"
    safeToTranslate: false
  - split: 3
    subIndex: 1
    text: "“学而时习之，不亦说乎？有朋自远方来，不亦乐乎？人不知而不愠，不亦君子乎？”"
    translated: "Is it not a joy to learn and practice what you have learned in due time? Is it not a pleasure when friends come from afar? Is it not the mark of a gentleman to remain unruffled even when others do not recognize your worth?"
    safeToTranslate: false
  - split: 3
    subIndex: 2
    text: "有子曰"
    translated: "Master said:"
    safeToTranslate: false
  - split: 3
    subIndex: 3
    text: "“其为人也孝弟，而好犯上者，鲜矣；不好犯上而好作乱者，未之有也。君子务本，本立而道生。孝弟也者，其为仁之本与！”"
    translated: "Such a person is filial and fraternal, yet fond of defying superiors-how rare is that! One who does not defy superiors yet delights in rebellion has never existed. The gentleman devotes himself to the root; when the root is established, the Way arises. Filiality and fraternal respect-are they not the root of benevolence?"
    safeToTranslate: false
  - split: 3
    subIndex: 4
    text: "子曰"
    translated: "Master said"
    safeToTranslate: false
  - split: 3
    subIndex: 5
    text: "“巧言令色，鲜矣仁！”"
    translated: "Smooth talk and a pleasant face are rarely accompanied by true benevolence!"
    safeToTranslate: false
  - split: 3
    subIndex: 6
    text: "曾子曰"
    translated: "Master Zeng said"
    safeToTranslate: false
  - split: 3
    subIndex: 7
    text: "“吾日三省吾身"
    translated: "'I examine myself three times a day"
    safeToTranslate: false
  - split: 3
    subIndex: 8
    text: "为人谋而不忠乎？与朋友交而不信乎？传不习乎？”"
    translated: "Have I been disloyal in serving others? Have I been untrustworthy in my dealings with friends? Have I failed to practice what I have learned?'"
    safeToTranslate: false
  - split: 3
    subIndex: 9
    text: "子曰"
    translated: "Master said"
    safeToTranslate: false
  - split: 3
    subIndex: 10
    text: "“道千乘之国，敬事而信，节用而爱人，使民以时。”"
    translated: "Govern a state of a thousand chariots with reverence and trustworthiness; be frugal in expenditure and loving toward the people; employ them only at the proper times."
    safeToTranslate: false
  - split: 3
    subIndex: 11
    text: "子曰"
    translated: "Master said"
    safeToTranslate: false
  - split: 3
    subIndex: 12
    text: "“弟子入则孝，出则弟，谨而信，泛爱众，而亲仁，行有余力，则以学文。”"
    translated: "When a disciple is at home, he should be filial; when outside, he should be respectful to his elders. He should be careful in his conduct and faithful in his words, showing broad love to all and drawing close to the benevolent. If he still has energy to spare after these duties, he should then apply himself to learning."
    safeToTranslate: false
  - split: 3
    subIndex: 13
    text: "子夏曰"
    translated: "Zixia said"
    safeToTranslate: false
  - split: 3
    subIndex: 14
    text: "“贤贤易色；事父母，能竭其力；事君，能致其身；与朋友交，言而有信。虽曰未学，吾必谓之学矣。”"
    translated: "A man who values virtue over beauty; who serves his parents with all his strength; who serves his lord with his whole self; and who keeps his word in dealings with friends-though he may claim to be unlearned, I would call him a scholar."
    safeToTranslate: false
  - split: 3
    subIndex: 15
    text: "子曰"
    translated: "Master said"
    safeToTranslate: false
  - split: 3
    subIndex: 16
    text: "“君子不重则不威，学则不固。主忠信，无友不如己者，过，则勿惮改。”"
    translated: "A gentleman who lacks gravity lacks dignity; his learning will be insecure. He should be faithful and sincere in his conduct, and associate only with those who are equal to or better than himself. When he makes a mistake, he should not hesitate to correct it."
    safeToTranslate: false
  - split: 3
    subIndex: 17
    text: "曾子曰"
    translated: "Master Zeng said"
    safeToTranslate: false
  - split: 3
    subIndex: 18
    text: "“慎终追远，民德归厚矣。”"
    translated: "Be cautious at the end and remember the distant past, and the people's virtue will return to its thickness."
    safeToTranslate: false
  - split: 3
    subIndex: 19
    text: "子禽问于子贡曰"
    translated: "Zi Qin asked Zi Gong, saying:"
    safeToTranslate: false
  - split: 3
    subIndex: 20
    text: "“夫子至于是邦也，必闻其政，求之与，抑与之与？”子贡曰"
    translated: "When the Master arrived in a state, he would certainly inquire about its governance. Was he seeking to participate in it, or was he being offered a position? Zigong said"
    safeToTranslate: false
  - split: 3
    subIndex: 21
    text: "“夫子温、良、恭、俭、让以得之。夫子之求之也，其诸异乎人之求之与？”"
    translated: "Master Wen acquired his position through warmth, goodness, respect, frugality, and humility. In the way Master Wen sought it, perhaps he differed from others in their pursuit?"
    safeToTranslate: false
  - split: 3
    subIndex: 22
    text: "子曰"
    translated: "Master said"
    safeToTranslate: false
  - split: 3
    subIndex: 23
    text: "“父在，观其志；父没，观其行；三年无改于父之道，可谓孝矣。”"
    translated: "When a father is alive, observe his son's aspirations; when he has passed, observe his actions. If after three years the son does not alter his father's way, he may be called filial."
    safeToTranslate: false
  - split: 3
    subIndex: 24
    text: "有子曰"
    translated: "Master said:"
    safeToTranslate: false
  - split: 3
    subIndex: 25
    text: "“礼之用，和为贵。先王之道，斯为美，小大由之。有所不行，知和而和，不以礼节之，亦不可行也。”"
    translated: "The use of propriety values harmony as the most precious. The way of the former kings was beautiful in this respect; both great and small matters followed it. However, if there are cases where this cannot be carried out, and one knows harmony but pursues harmony without regulating it by propriety, then it also cannot be carried out."
    safeToTranslate: false
  - split: 3
    subIndex: 26
    text: "有子曰"
    translated: "Master said:"
    safeToTranslate: false
  - split: 3
    subIndex: 27
    text: "“信近于义，言可复也。恭近于礼，远耻辱也。因不失其亲，亦可宗也。”"
    translated: "Trust that aligns with righteousness makes one's words trustworthy. Reverence that aligns with propriety keeps one far from disgrace. Relying on others without losing sight of the worthy is also worthy of trust."
    safeToTranslate: false
  - split: 3
    subIndex: 28
    text: "子曰"
    translated: "Master said"
    safeToTranslate: false
  - split: 3
    subIndex: 29
    text: "“君子食无求饱，居无求安，敏于事而慎于言，就有道而正焉。可谓好学也已。”"
    translated: "A gentleman does not seek to be well-fed in his food, nor to be at ease in his dwelling; he is quick in action and cautious in speech. He associates with those who have the Way in order to rectify himself. This may be called a love of learning."
    safeToTranslate: false
  - split: 3
    subIndex: 30
    text: "子贡曰"
    translated: "Zigong said"
    safeToTranslate: false
  - split: 3
    subIndex: 31
    text: "“贫而无谄，富而无骄，何如？”子曰"
    translated: "Being poor yet not servile, and being rich yet not arrogant-how is that? The Master said"
    safeToTranslate: false
  - split: 3
    subIndex: 32
    text: "“可也。未若贫而乐，富而好礼者也。”子贡曰"
    translated: "Indeed. Yet one who is poor yet finds joy in life, or wealthy yet reveres propriety, surpasses such a person. Zigong said"
    safeToTranslate: false
  - split: 3
    subIndex: 33
    text: "“《诗》云"
    translated: "Book of Songs says"
    safeToTranslate: false
  - split: 3
    subIndex: 34
    text: "‘如切如磋，如琢如磨’，其斯之谓与？”子曰"
    translated: "As if cutting and filing, as if carving and polishing'-is this what is meant by it? The Master said"
    safeToTranslate: false
  - split: 3
    subIndex: 35
    text: "“赐也，始可与言《诗》已矣，告诸往而知来者。”"
    translated: "Zi, you may now discuss the Book of Songs with me. You can infer what is to come from what has been told."
    safeToTranslate: false
  - split: 3
    subIndex: 36
    text: "子曰"
    translated: "Master said"
    safeToTranslate: false
  - split: 3
    subIndex: 37
    text: "“不患人之不己知，患不知人也。”"
    translated: "Do not worry that others do not know you; worry that you do not know others."
    safeToTranslate: false
