- raw: "16,980029,2,弟仲亲启：\\n自连环寨矗于镇外，承安风雨飘摇，西门家既居此位，已断难独善其身。汝自幼虽无意于继掌族业，然此危急之年，恐需以西门氏之存续为重，吾自与连环寨暂作周旋。倘若事有不协，吾身死无妨，西门一脉便着于汝手。\\n海天在望，不尽依迟。 ,,,,,"
