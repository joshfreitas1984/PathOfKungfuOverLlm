    translated: "These days, bandits run rampant. I have not received a letter from you in a long time, and I do not know if you, alone out there, have found a place of safety, or if you are able to eat your fill and stay warm."
  - split: 3
    subIndex: 3
    text: "不用太过担心家中，女儿更加乖巧懂事了，现在能够帮我取丝来补贴家用了。女儿十分思念你，每日吵着要见父亲。"
    translated: "There is no need to worry about home. My daughter has become even more obedient and sensible; she can now help me spin silk to supplement our household income. She misses you greatly and begs to see her father every day."
  - split: 3
    subIndex: 4
    text: "唉...哪怕未积攒下钱财，也尽早归家，平安回来。我们多穿几件薄衣，修补好屋中破洞，也能熬过这个冬天。"
    translated: "Sigh... Even if we haven't saved up any money, let's return home as soon as possible and come back safely. If we wear a few extra layers of thin clothing and patch up the holes in the house, we can get through this winter."
