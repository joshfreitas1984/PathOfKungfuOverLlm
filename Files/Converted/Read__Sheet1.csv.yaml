- raw: "29,980042,2,《圆觉经》言：诸戒定慧及淫怒痴，俱是梵行。慧寂愚钝，参了十年空即是色，却参不透小蝶姑娘句句禅机。\\n我那徒儿方才竟在抄下的法华经中掺了句《六祖坛经》——佛法在世间，不离世间觉。于是大彻大悟，还俗去也。自此酒肉穿肠是供养，闺阁画眉即诵经。谢佛门渡我之恩，谢阁下当头棒喝，江湖路远，就此相别。\\n慧寂敬拜。,,,,,"
  splits:
  - split: 3
    text: "《圆觉经》言"
    translated: "The Sutra of Perfect Enlightenment states"
    qcReviewedText: "The Sutra of Perfect Enlightenment states：All precepts, concentration, wisdom, lust, anger, and ignorance are all part of the Brahma way. Huiji is dull and obtuse; he has meditated for ten years on emptiness is form, yet he cannot fathom the Zen riddles in every word spoken by Miss Xiaodie.\\nMy disciple has just slipped a line from the Platform Sutra of the Sixth Patriarch into his copied Lotus Sutra: The Buddha's Way is in the world; it does not depart from worldly awakening. Thus he attained great enlightenment and has returned to secular life. From now on, wine and meat passing through his gut are offerings, and painting eyebrows in the boudoir is reciting sutras. I thank the Buddhist gate for its grace of salvation, and I thank you for your sudden awakening blow. The Jianghu Road is long; we part here.\\nHuiji pays his respects"
    qcTranslated: "The Sutra of Perfect Enlightenment states：All precepts, concentration, wisdom, lust, anger, and ignorance are all part of the Brahma way. Huiji is dull and obtuse; he has meditated for ten years on emptiness is form, yet he cannot fathom the Zen riddles in every word spoken by Miss Xiaodie.\\nMy disciple has just slipped a line from the Platform Sutra of the Sixth Patriarch into his copied Lotus Sutra: The Buddha's Way is in the world; it does not depart from worldly awakening. Thus he attained great enlightenment and has returned to secular life. From now on, wine and meat passing through his gut are offerings, and Huamei in the boudoir is reciting sutras. I thank the Buddhist gate for its grace of salvation, and I thank you for your sudden awakening blow. The Jianghu Road is long; we part here.\\nHuiji pays his respects"
    qcStatus: Corrected
    qcQualityScore: 95
    qcDefectCategory: OtherNamedDefect
    qcDefectCategories:
    - OtherNamedDefect
  - split: 3
    subIndex: 1
    text: "诸戒定慧及淫怒痴，俱是梵行。慧寂愚钝，参了十年空即是色，却参不透小蝶姑娘句句禅机。"
    translated: "All precepts, concentration, wisdom, lust, anger, and ignorance are all part of the Brahma way. Huiji is dull and obtuse; he has meditated for ten years on emptiness is form, yet he cannot fathom the Zen riddles in every word spoken by Miss Xiaodie."
  - split: 3
    subIndex: 2
    text: "我那徒儿方才竟在抄下的法华经中掺了句《六祖坛经》——佛法在世间，不离世间觉。于是大彻大悟，还俗去也。自此酒肉穿肠是供养，闺阁画眉即诵经。谢佛门渡我之恩，谢阁下当头棒喝，江湖路远，就此相别。"
    translated: "My disciple has just slipped a line from the Platform Sutra of the Sixth Patriarch into his copied Lotus Sutra: The Buddha's Way is in the world; it does not depart from worldly awakening. Thus he attained great enlightenment and has returned to secular life. From now on, wine and meat passing through his gut are offerings, and painting eyebrows in the boudoir is reciting sutras. I thank the Buddhist gate for its grace of salvation, and I thank you for your sudden awakening blow. The Jianghu Road is long; we part here."
  - split: 3
    subIndex: 3
    text: "慧寂敬拜。"
    translated: "Huiji pays his respects"
