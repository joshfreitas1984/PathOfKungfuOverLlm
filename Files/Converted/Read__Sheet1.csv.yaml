- raw: "8,980021,2,江夫见信如面：\\n\\n冬日将至，天愈寒冷，家中不够钱添置棉衣，需得你寄回五六百钱来，我去东市买棉布来编衣，能省下不少钱。\\n\\n现如今匪祸横行，许久未收到你的信件，也不知你自己独身一人在外，能否寻得一处安定居所，能否吃饱穿暖？\\n\\n不用太过担心家中，女儿更加乖巧懂事了，现在能够帮我取丝来补贴家用了。女儿十分思念你，每日吵着要见父亲。\\n\\n唉...哪怕未积攒下钱财，也尽早归家，平安回来。我们多穿几件薄衣，修补好屋中破洞，也能熬过这个冬天。\\n\\n盼即赐复。,,,,,"
  splits:
  - split: 3
    text: "江夫见信如面"
    translated: "Husband Jiang, this letter serves as my presence before you."
    qcReviewedText: "Husband Jiang, this letter serves as my presence before you.：\\n\\nWinter is approaching and the cold is intensifying. We do not have enough money at home to buy padded clothing. Please send back five or six hundred coins so I can purchase cotton cloth from the East Market and sew clothes myself, which will save us a considerable amount of money.\\n\\nThese days, bandits run rampant. I have not received a letter from you in a long time, and I do not know if you, alone out there, have found a place of safety, or if you are able to eat your fill and stay warm.\\n\\nThere is no need to worry about home. My daughter has become even more obedient and sensible; she can now help me spin silk to supplement our household income. She misses you greatly and begs to see her father every day.\\n\\nSigh... Even if we haven't saved up any money, let's return home as soon as possible and come back safely. If we wear a few extra layers of thin clothing and patch up the holes in the house, we can get through this winter.\\n\\nI await your reply"
    qcTranslated: "Husband Jiang, this letter serves as my presence before you:\\n\\nWinter is approaching and the cold is intensifying. We do not have enough money at home to buy padded clothing. Please send back five or six hundred coins so I can purchase cotton cloth from the East Market and sew clothes myself, which will save us a considerable amount of money.\\n\\nThese days, bandits run rampant. I have not received a letter from you in a long time, and I do not know if you, alone out there, have found a place of safety, or if you are able to eat your fill and stay warm.\\n\\nThere is no need to worry about home. My daughter has become even more obedient and sensible; she can now help me spin silk to supplement our household income. She misses you greatly and begs to see her father every day.\\n\\nSigh... Even if we haven't saved up any money, let's return home as soon as possible and come back safely. If we wear a few extra layers of thin clothing and patch up the holes in the house, we can get through this winter.\\n\\nI await your reply"
    qcStatus: Corrected
    qcQualityScore: 95
    qcDefectCategory: OtherNamedDefect
    qcDefectCategories:
    - OtherNamedDefect
  - split: 3
