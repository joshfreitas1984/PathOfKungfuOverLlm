- raw: "3,980011,2,还请阁下莫以一时乱了心神，我已飞鸽传书于京城王家，只是山高路远，恐难相顾。\\n此番若事有不协，张大侠行踪无定，于此事之上，恐难相助。即刻去寻燕大侠，或有一线之机。\\n此去艰辛，万望保重，若事不可为……切莫再归。\\n南宫莲笔,,,,,"
  splits:
  - split: 3
    text: "还请阁下莫以一时乱了心神，我已飞鸽传书于京城王家，只是山高路远，恐难相顾。"
    translated: "I beg you not to let your mind be clouded by the moment. I have already sent a carrier pigeon to the Wang family in the Capital City, but given the vast distances and rugged terrain, they may not be able to come to your aid."
    qcReviewedText: "I beg you not to let your mind be clouded by the moment. I have already sent a carrier pigeon to the Wang family in the Capital City, but given the vast distances and rugged terrain, they may not be able to come to your aid.\\nIf things go awry this time, Great Hero Zhang's whereabouts are uncertain, and he may be unable to lend a hand. Go find Great Hero Yan immediately; there may still be a slim chance.\\nThe road ahead is fraught with hardship. Please take great care of yourself. Should the mission prove impossible... do not return.\\nNangong Lian's brush"
    qcStatus: Passed
