    translated: "In my youth, my family was poor; in summer I had no fan for coolness, and in winter lacked a fur coat or stove. Upon reaching the age of fifteen, I entered a tavern to work as an apprentice. Through careful observation, diligent inquiry, and earnest study of commerce, I eventually mastered its essentials. A few years later, I borrowed capital from the wealthy in the city to establish a restaurant. Initially, business was thriving, but the weight of old debts pressed upon me. As profits were reinvested, my assets and property still fell short of repayment. Forced by circumstances, I fled to the southern frontier, and from then on, I resolved my mind..."
