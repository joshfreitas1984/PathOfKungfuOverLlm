- raw: "28,980041,2,执笔欲书，泪潸然，手颤颤。\\n妾知大限将至，每念及此，悲恸难抑。自与君结发，往昔岁月如璨珠熠熠。犹记初逢之时，君跨马执鞭，马踏江湖，何等风采？结为夫妻，相濡以沫，君亦无怨无悔，虽因妾故为王扫庭所害，囚于村中，亦能如妾之春阳，若妾之明月，未尝有怨。\\n今妾身染沉疴，药石罔效。生死有命，不可强求。果果年幼，需君悉心教导，望君以慈育之，以严规之，果果若有所成，妾于九泉之下，亦能瞑目。\\n唐兰月绝笔,,,,,"
  splits:
  - split: 3
    text: "执笔欲书，泪潸然，手颤颤。"
    translated: "I take up the brush to write, but tears fall, and my hand trembles."
    qcReviewedText: "I take up the brush to write, but tears fall, and my hand trembles.\\nI know my time is near its end, and each thought of it brings me to tears. Since we were joined in marriage, our past days have shone like bright pearls. I still remember when we first met: you rode a horse, whip in hand, trampling through the Jianghu-what a commanding presence! We became husband and wife, supporting each other through thick and thin. You never once regretted it. Even though, because of me, you were harmed by Wang Sao Ting and imprisoned in the village, you remained like my spring sun, like my bright moon, without a single word of complaint.\\nI am now afflicted with a grave illness, and no medicine can cure it. Life and death are fated; they cannot be forced. Guoguo is still young and requires your careful guidance. I beg you to nurture her with kindness and discipline her with strictness. If she achieves something in life, I shall rest peacefully even from the depths of the underworld.\\nTang Lanyue's Final Words"
    qcStatus: Passed
    qcQualityScore: 100
    qcDefectCategory: None
  - split: 3
    subIndex: 1
    text: "妾知大限将至，每念及此，悲恸难抑。自与君结发，往昔岁月如璨珠熠熠。犹记初逢之时，君跨马执鞭，马踏江湖，何等风采？结为夫妻，相濡以沫，君亦无怨无悔，虽因妾故为王扫庭所害，囚于村中，亦能如妾之春阳，若妾之明月，未尝有怨。"
    translated: "I know my time is near its end, and each thought of it brings me to tears. Since we were joined in marriage, our past days have shone like bright pearls. I still remember when we first met: you rode a horse, whip in hand, trampling through the Jianghu-what a commanding presence! We became husband and wife, supporting each other through thick and thin. You never once regretted it. Even though, because of me, you were harmed by Wang Sao Ting and imprisoned in the village, you remained like my spring sun, like my bright moon, without a single word of complaint."
  - split: 3
