- raw: "24,980037,2,余幼时家贫，夏无凉扇，冬欠裘炉。束发年入酒楼帮工，细观躬问，勤习商略，终得其要。数年后，自城中豪富处借抵家资，开办饭铺，初始生意颇隆，然旧贷压身，以利翻利，家资房舍尚不足抵，不得已亡命南疆，自此明志……\\n后半段因浸水染土，字迹已然难辨明晰。,,,,,"
  splits:
