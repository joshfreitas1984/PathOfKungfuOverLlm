- raw: "10,980023,2,无名兄，见信如晤：\\n十余载未见，当年兄台故乡一别，余至今仍难以忘怀。\\n\\n那夜在下久寻兄而不得，便寻至兄家，兄母即赴黄泉代余寻尔，而兄嫂，兄妹则招待侍寝，而后便自追随父母，甚是无趣。兄当年何不同去？\\n\\n既当年未行，便可来青萍村寻我。弟暂遣弟之得意门生传信，望兄到时切莫耽搁，我兄弟二人之事，尚未了结。 \\n\\n顺颂时祺。,,,,,"
  splits:
  - split: 3
    text: "无名兄，见信如晤"
    translated: "Brother Wuming, may this letter find you well."
    qcReviewedText: "Brother Wuming, may this letter find you well.：\\nIt has been over ten years since we last met. I still cannot forget our parting in your homeland all those years ago.\\n\\nThat night, I searched for you for a long time but could not find you. I then went to your home, where your mother immediately departed for the Yellow Springs to search for you on my behalf. Your wife and siblings, however, entertained me and attended to my rest. Afterward, I followed my parents, which was rather dull. Why did you not go with them back then?\\n\\nSince you did not act back then, you may come to Qingping Village to find me. I have sent my most promising disciple to deliver this message. I hope you will not delay upon your arrival. The matters between you and me are far from settled. \\n\\nWith best wishes for the season"
    qcTranslated: "Brother Wuming, may this letter find you well.\\nIt has been over ten years since we last met. I still cannot forget our parting in your homeland all those years ago.\\n\\nThat night, I searched for you for a long time but could not find you. I then went to your home, where your mother immediately departed for the Yellow Springs to search for you on my behalf. Your wife and siblings, however, entertained me and attended to my rest. Afterward, they followed their parents, which was rather dull. Why did you not go with them back then?\\n\\nSince you did not act back then, you may come to Qingping Village to find me. I have sent my most promising disciple to deliver this message. I hope you will not delay upon your arrival. The matters between you and me are far from settled. \\n\\nWith best wishes for the season"
