- raw: "372,95201051,三昧阿修罗道,内功,7906,秘籍,武学研本,2,1,0,34,1;201005,2010501,,1,True,200,3000,4000,\"use,1\",,1,无,1,,修习,神狩四年，刀祖于红梅叛出少林后独创此法：有德而性骄慢，受教而不改执，闻法而不能悟，是为修罗。,习得三昧阿修罗道,item/951000,,1,1,,,"
  splits:
  - split: 2
    text: "三昧阿修罗道"
    translated: "Samadhi Asura Path"
  - split: 3
    text: "内功"
    translated: "Neigong"
  - split: 26
    text: "神狩四年，刀祖于红梅叛出少林后独创此法"
    translated: "In the fourth year of Shenshou, after the Ancestor of Knives, Yu Hongmei, left Shaolin, he created this technique on his own."
  - split: 26
    subIndex: 1
    text: "有德而性骄慢，受教而不改执，闻法而不能悟，是为修罗。"
    translated: "One who has virtue but is arrogant and proud, who receives instruction but does not change their ways, who hears the law but cannot understand it, is called an Asura."
  - split: 27
    text: "习得三昧阿修罗道"
    translated: "Learned the Samadhi Asura Path"
  templates:
  - split: 26
    template: "{0}：{1}"
