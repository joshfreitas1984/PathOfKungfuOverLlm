- raw: "63,201014,太虚无极劲,内功,太和,,,2011401;2011402;2011403;2011404;2011405;2011406;2011407;2011408;2011409;2011410;2011411,,,7,梦冷通仙阙，神融合太虚，据传乃太和道祖羽化所遗，与诸多修习之法迥异，讲求清净自然，顿悟登仙，唯悟性奇高者方可修习。,skill/201014,,0,201014,太虚无极劲,,,"
