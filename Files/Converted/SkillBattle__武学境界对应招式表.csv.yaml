    translated: "Derived from the Fragments of the Hetu and Luoshu, it is bizarre and grotesque, and its practitioners are known for their cruelty and brutality; none have met a good end."
- raw: "52,201003,连珏天璧法,内功,江湖武学,,,2010301;2010302;2010303;2010304;2010305;2010306;2010307;2010308;2010309;2010310;2010311,,,7,暇璧珠碎，连珏不破，其中所载心法至刚若柔，妙用无穷。,skill/201003,,1,201003,连珏天璧法,,,"
