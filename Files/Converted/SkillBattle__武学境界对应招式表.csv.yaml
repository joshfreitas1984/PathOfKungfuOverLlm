- raw: "51,201002,嗤魔祭血真经,内功,江湖武学,,,2010201;2010202;2010203;2010204;2010205;2010206;2010207;2010208;2010209;2010210;2010211,,,7,自河图洛书残篇之上衍化而出，奇诡怪诞，更兼残暴嗜虐，修习此术者无一善终。,skill/201002,,0,201002,嗤魔祭血真经,,,"
