    translated: "The orthodox Buddhist school is vast and profound; if they unleash their powers with a mighty cry, thunderous sounds roll out, striking fear into the hearts of enemies and causing them to flee without a fight."
- raw: "62,201013,金钟护体罩,内功,江湖武学,,,2011301;2011302;2011303;2011304;2011305;2011306;2011307;2011308;2011309;2011310;2011311,,,7,两禅寺新立，诸式流出，此心法亦是在少林分立之乱中传至江湖，后不知所踪，终不为人知。,skill/201013,,0,201013,金钟护体罩,,,"
