- raw: "61,201012,禅音狮子吼,内功,江湖武学,,,2011201;2011202;2011203;2011204;2011205;2011206;2011207;2011208;2011209;2011210;2011211,,,7,佛门正宗，浩瀚磅礴，倘若发功呼啸，雷音滚滚，令敌肝胆俱裂，不战而溃。,skill/201012,,0,201012,禅音狮子吼,,,"
