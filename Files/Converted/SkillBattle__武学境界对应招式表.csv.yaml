- raw: "58,201009,吸星噬寰图,内功,江湖武学,,,2010901;2010902;2010903;2010904;2010905;2010906;2010907;2010908;2010909;2010910;2010911,,,7,吸星而吞宇，噬寰而堙尘，此式霸道冠绝天下，远非寻常武学可比，但因其威势过烈，非大毅力之人难习至巅峰。,skill/201009,,0,201009,吸星噬寰图,,,"
