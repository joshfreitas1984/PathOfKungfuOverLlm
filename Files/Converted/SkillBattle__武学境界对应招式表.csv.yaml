    translated: "Xiangfei's tears formed bamboo, flowing water indifferent to the burial of orchids; this book contains both martial arts and poetry, its sorrowful meaning too painful to speak of."
- raw: "60,201011,昭霞别册,内功,江湖武学,,,2011101;2011102;2011103;2011104;2011105;2011106;2011107;2011108;2011109;2011110;2011111,,,7,世所罕见的内功心法，运使若朝霞漫天，云野四盖，紫气至处，万化皆消。,skill/201011,,1,201011,昭霞别册,,,"
