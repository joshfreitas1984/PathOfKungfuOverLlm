  - text: "使用混合武学时，将根据武学招式来源的武学名称，获取对应武学的全部被动招式效果。"
    translated: "When using a Hybrid Martial Art, the effects of all passive moves from the corresponding martial art will be obtained based on the name of the martial art the move originates from."
    qcReviewedText: "\\nWhen using a Hybrid Martial Art, the effects of all passive moves from the corresponding martial art will be obtained based on the name of the martial art the move originates from.\\nUnlocked attribute boosts from passive moves, which will partially take effect in battle but will not be reflected in the attributes interface."
    qcStatus: Passed
    qcQualityScore: 100
    qcDefectCategory: None
