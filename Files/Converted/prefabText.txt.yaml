- raw: "江湖散学是各类武器的普通攻击，重击，格挡，跳跃，弹反等等。当你切换武器类型的时候，会自动切换到对应武器种类的江湖散学。可以在各地武馆购买学习。"
  splits:
  - text: "江湖散学是各类武器的普通攻击，重击，格挡，跳跃，弹反等等。当你切换武器类型的时候，会自动切换到对应武器种类的江湖散学。可以在各地武馆购买学习。"
    translated: "Jianghu Miscellaneous Art includes normal attacks, heavy attacks, blocks, jumps, parries, and more for various weapons. When you switch weapon types, it automatically switches to the corresponding Jianghu Miscellaneous Art for that weapon. You can purchase and learn it at martial arts halls in various locations."
