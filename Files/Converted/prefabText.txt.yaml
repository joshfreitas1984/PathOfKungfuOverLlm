- raw: "                     满江红\\n怒发冲冠，凭栏处、潇潇雨歇。抬望眼、仰天长啸，壮怀激烈。三十功名尘与土，八千里路云和月。莫等闲、白了少年头，空悲切。\\n\\n靖康耻，犹未雪。臣子恨，何时灭。驾长车，踏破贺兰山缺。壮志饥餐胡虏肉，笑谈渴饮匈奴血。待从头、收拾旧山河，朝天阙。\\n\\n                     破阵子\\n醉里挑灯看剑，梦回吹角连营。八百里分麾下炙，五十弦翻塞外声，沙场秋点兵。\\n\\n马作的卢飞快，弓如霹雳弦惊。了ee"
  splits:
  - text: "满江红"
    translated: "Red River of War"
    qcReviewedText: "                     Red River of War \\nFuriously raising my head, by the railing where the drizzling rain has ceased. Lifting my gaze, I look up to the sky and let out a long roar, my heart filled with intense passion. Thirty years of fame and glory are but dust and ashes; eight thousand miles of journey under clouds and moonlight. Do not squander your youth, for it is too late to lament when your hair turns white.\\n\\nThe humiliation of Jingkang remains unavenged. The hatred of the minister and son, when will it end? Drive chariots long and far, to crush the gaps in Mount Helan. With lofty aspirations, hunger for the flesh of barbarian invaders, laugh and talk while drinking the blood of the Xiongnu. Wait until we start anew, to restore the old rivers and mountains, and present ourselves before the Heavenly Gate.\\n\\n                     Breaking Array Tune \\nDrunk, I draw my sword to the lamplight; in dreams, bugles sound across camps. Eight hundred miles, I share roasted meat with my troops; fifty strings play tunes of frontier lands, as autumn comes to muster troops on the battlefield.\\n\\nWarhorses dash like Lu horses, swift and fierce; bows twang like lightning strikes, startlingly loud.ee"
    qcTranslated: "Red River of War \\nFuriously raising my head, by the railing where the drizzling rain has ceased. Lifting my gaze, I look up to the sky and let out a long roar, my heart filled with intense passion. Thirty years of fame and glory are but dust and ashes; eight thousand miles of journey under clouds and moonlight. Do not squander your youth, for it is too late to lament when your hair turns white.\\n\\nThe humiliation of Jingkang remains unavenged. The hatred of the minister and son, when will it end? Drive chariots long and far, to crush the gaps in Mount Helan. With lofty aspirations, hunger for the flesh of barbarian invaders, laugh and talk while drinking the blood of the Xiongnu. Wait until we start anew, to restore the old rivers and mountains, and present ourselves before the Heavenly Gate.\\n\\n                     Breaking Array Tune \\nDrunk, I draw my Sword to the lamplight; in dreams, bugles sound across camps. Eight hundred li, I share roasted meat with my troops; fifty strings play tunes of frontier lands, as autumn comes to muster troops on the battlefield.\\n\\nWarhorses dash like Lu horses, swift and fierce; bows twang like lightning strikes, startlingly loud.ee"
    qcStatus: Corrected
    qcQualityScore: 90
    qcDefectCategory: GarbledNumber
    qcDefectCategories:
    - GarbledNumber
    - DroppedContent
  - subIndex: 1
    text: "怒发冲冠，凭栏处、潇潇雨歇。抬望眼、仰天长啸，壮怀激烈。三十功名尘与土，八千里路云和月。莫等闲、白了少年头，空悲切。"
    translated: "Furiously raising my head, by the railing where the drizzling rain has ceased. Lifting my gaze, I look up to the sky and let out a long roar, my heart filled with intense passion. Thirty years of fame and glory are but dust and ashes; eight thousand miles of journey under clouds and moonlight. Do not squander your youth, for it is too late to lament when your hair turns white."
  - subIndex: 2
    text: "靖康耻，犹未雪。臣子恨，何时灭。驾长车，踏破贺兰山缺。壮志饥餐胡虏肉，笑谈渴饮匈奴血。待从头、收拾旧山河，朝天阙。"
    translated: "The humiliation of Jingkang remains unavenged. The hatred of the minister and son, when will it end? Drive chariots long and far, to crush the gaps in Mount Helan. With lofty aspirations, hunger for the flesh of barbarian invaders, laugh and talk while drinking the blood of the Xiongnu. Wait until we start anew, to restore the old rivers and mountains, and present ourselves before the Heavenly Gate."
  - subIndex: 3
    text: "破阵子"
    translated: "Breaking Array Tune"
  - subIndex: 4
    text: "醉里挑灯看剑，梦回吹角连营。八百里分麾下炙，五十弦翻塞外声，沙场秋点兵。"
    translated: "Drunk, I draw my sword to the lamplight; in dreams, bugles sound across camps. Eight hundred miles, I share roasted meat with my troops; fifty strings play tunes of frontier lands, as autumn comes to muster troops on the battlefield."
  - subIndex: 5
    text: "马作的卢飞快，弓如霹雳弦惊。了"
    translated: "Warhorses dash like Lu horses, swift and fierce; bows twang like lightning strikes, startlingly loud."
