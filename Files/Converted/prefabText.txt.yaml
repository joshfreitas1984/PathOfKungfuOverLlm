- raw: "本游戏是一款武侠类角色扮演游戏，适用于年满12周岁及以上的用户，建议未成年人在家长监护下使用本游戏产品。我们鼓励家长根据未成年人的实际情况管理其游戏行为。\\n\\n本游戏用用户实名认证系统，认证为未成年人的用户将接受以下管理：\\n\\n1，游戏中所有的付费道具，未满8周岁的用户不能付费；\\n2，8周岁以上未满16周岁的未成年人用户，单次充值金额不得超过50元人民币，每月充值金额累计不得超过200元人民币；\\n3，16周岁以上的未成年人用户，单次金额不得超过100元人民币，每月充值金额累计不得超过400元人民币；\\n4，未成年用户仅在周五，周六，周日的20:00~21:00体验游戏，其他时间均不可使用。"
  splits:
  - text: "本游戏是一款武侠类角色扮演游戏，适用于年满12周岁及以上的用户，建议未成年人在家长监护下使用本游戏产品。我们鼓励家长根据未成年人的实际情况管理其游戏行为。"
    translated: "This game is a Wuxia role-playing game suitable for users aged 12 and over. We recommend that minors use this game product under parental supervision. We encourage parents to manage their children's gaming behavior based on their actual circumstances."
  - subIndex: 1
    text: "本游戏用用户实名认证系统，认证为未成年人的用户将接受以下管理"
    translated: "This game uses a real-name authentication system. Users authenticated as minors will be subject to the following management:"
  - subIndex: 2
    text: "1，游戏中所有的付费道具，未满8周岁的用户不能付费；"
    translated: "1, in the game, all paid items are not available for purchase to users under 8 years old;"
  - subIndex: 3
    text: "2，8周岁以上未满16周岁的未成年人用户，单次充值金额不得超过50元人民币，每月充值金额累计不得超过200元人民币；"
    translated: "Users who are 2 years old or older but under 8 years old may not spend more than 16 RMB in a single charge, and their total monthly spending may not exceed 50 RMB; '200'"
  - subIndex: 4
    text: "3，16周岁以上的未成年人用户，单次金额不得超过100元人民币，每月充值金额累计不得超过400元人民币；"
    translated: "Users aged 3 to 16 years old may not spend more than 100 RMB in a single transaction or 400 RMB in total monthly charges."
  - subIndex: 5
    text: "4，未成年用户仅在周五，周六，周日的20"
    translated: "4, minor users are only allowed on Fridays, Saturdays, and Sundays at 20."
  - subIndex: 6
    text: "00体验游戏，其他时间均不可使用。"
    translated: "00 can only be used while playing the game; at all other times, it is unusable."
  templates:
  - template: "{0}\\n\\n{1}：\\n\\n{2}\\n{3}\\n{4}\\n{5}:00~21:{6}"
