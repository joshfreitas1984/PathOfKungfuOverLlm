- raw: "天行书，曰君子自强，虽百屈而不饶者，方可领会其真意，若天赋寰宇，其势不可挡，不可转，不可折，不可逆，不可滞，至刚至强，乃为天道。"
  splits:
  - text: "天行书，曰君子自强，虽百屈而不饶者，方可领会其真意，若天赋寰宇，其势不可挡，不可转，不可折，不可逆，不可滞，至刚至强，乃为天道。"
    translated: "Heavenly path, it says, the noble strive on their own strength; even if bent a hundred times, they do not yield. Only then can one grasp its true meaning. If endowed with talent that spans the universe, its force is unstoppable, unturnable, unbendable, irreversible, and unimpeded, supremely strong and resolute-this is the Heavenly path."
