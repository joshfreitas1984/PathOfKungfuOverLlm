    safeToTranslate: false
  - subIndex: 7
    text: "引子在京城客栈的旁边，通过场景中可交互的任务地块启动整条"
    translated: "Prologue: At the Inn next to the Capital City, start the entire sequence through an interactive task plot in the scene."
    safeToTranslate: false
  - subIndex: 8
    text: "任务链。"
    translated: "Task chain"
    safeToTranslate: false
  - subIndex: 9
    text: "我是《刀剑江湖路》的制作人，今天想跟大家聊聊这一年多来的经历，也算是给一直关心这个游戏的玩家们一个交代。"
    translated: "I am the producer of 'Dodge and Sword: Jianghu Road', and today I want to share with everyone the experiences of the past year or so, which can also be seen as an account for all the players who have been following this game."
    safeToTranslate: false
  - subIndex: 10
    text: "关于发行的坎坷"
    translated: "The ups and downs of the release"
    safeToTranslate: false
  - subIndex: 11
    text: "这个游戏前后换了三家发行商。"
    translated: "This game has had three different publishers"
    safeToTranslate: false
  - subIndex: 12
    text: "上线前，第一家突然说自己砍掉了所有单机业务线，我没多说，好聚好散；第二家接手后，正式版上线没多久又说资方要撤资。合同里本来约定按月协商回收预付款、我留一部分用于团队生存，结果对方要求一刀切——先把预付款全部扣完。"
    translated: "Before launch, the first company suddenly announced that they had cut all their single-player business lines; I didn't say much, parting ways amicably. The second company took over, but shortly after the official release, they said the investors were pulling out. According to the contract, we were supposed to negotiate monthly to recover the advance payments, and I had planned to keep a portion to sustain the team. However, the other party demanded a clean break-taking back all the advance payments immediately."
    safeToTranslate: false
  - subIndex: 13
    text: "那段时间，这个游戏的月分成是我唯一的收入来源。我争取过每月少给一点分成，对方没同意。"
    translated: "During that period, the game's monthly revenue share was my only source of income. I tried to negotiate for a smaller cut each month, but they didn't agree."
    safeToTranslate: false
  - subIndex: 14
    text: "结果就是"
    translated: "Result is"
    safeToTranslate: false
  - subIndex: 15
    text: "整整7个月，我几乎没有一分钱收入。多个贷款逾期，也拖欠了手下兄弟工资，非常对不起这些兄弟，目前还在一点一点的还他们工资，每次有钱入账我都优先还他们的工资再处理我自己的贷款。曾经有一周时间我连着每天吃6个茶叶蛋（真不是段子也不是卖惨，这样我一天只需要9块钱。），我跟老婆笑着说我是在减肥。但游戏没停更，几个兄弟跟我一起咬牙坚持，小更新一直在做但内容确实不多。"
    translated: "For over 7 months, I barely had any income at all. Multiple loans were overdue, and I also owed my brothers' wages, feeling very sorry to these brothers, currently repaying their wages bit by bit. Whenever money comes in, I prioritize repaying their wages before dealing with my own loans. There was even a week when I ate 6 boiled eggs every day (this is not an exaggeration or self-pity; this way, I only needed 9 dollars a day). My wife and I joked that I was on a diet. But the game didn't stop updating, and several brothers stuck with me through it all, biting the bullet to keep going. Small updates have been ongoing, but the content is indeed limited."
    safeToTranslate: false
  - subIndex: 16
    text: "直到去年12月，预付款终于扣完，每月开始有少量收入进来，我们才缓过一口气，随即投入大型"
    translated: "It wasn't until last 12 that the advance payment was finally deducted, and we started to catch our breath with a small income each month, only to immediately invest in a large project."
    safeToTranslate: false
  - subIndex: 17
    text: "的制作。"
    translated: "Of the production"
    safeToTranslate: false
  - subIndex: 18
    text: "关于"
    translated: "About"
    safeToTranslate: false
  - subIndex: 19
    text: "跑路"
    translated: "Fleeing"
    safeToTranslate: false
  - subIndex: 20
    text: "的谣言"
    translated: "Of rumors"
    safeToTranslate: false
  - subIndex: 21
    text: "从"
    translated: "From"
    safeToTranslate: false
  - subIndex: 22
    text: "版本起就有人说我跑路，那时候我还能理解——毕竟完整版没出来。但正式版上线之后，50"
    translated: "Ever since the beta, people have been saying I run away-back then I could understand that, after all the full version hadn't come out yet. But now that the official version is live, 50"
    safeToTranslate: false
  - subIndex: 23
    text: "小时的游玩时长、接近百万字的文案量，依然有人在说跑路，这真的是不合理。如果有人说游戏不好玩我都能理解并接受，也许我的制作能力确实一般，但为何说我跑路？以至于玩家群里戏称我为"
    translated: "With over ten hours of gameplay and nearly a million words of content, people still say I'm running away. This really isn't reasonable. If someone says the game isn't fun, I can understand and accept that; perhaps my production skills are indeed average. But why would they say I'm running away? To the point where players jokingly call me"
    safeToTranslate: false
  - subIndex: 24
    text: "百度贴吧每周传奇跑路王"
    translated: "Baidu Tieba Weekly Legend of the Runaway Champion"
    safeToTranslate: false
  - subIndex: 25
    text: "事实胜于雄辩"
    translated: "Facts speak louder than words"
    safeToTranslate: false
  - subIndex: 26
    text: "正式版上线快一年了，我承诺的大型"
    translated: "It's been almost a year since the official release, and I promised a major update,"
    safeToTranslate: false
  - subIndex: 27
    text: "已经做完，7月27号就会正式上线。"
    translated: "It's all done; it will officially launch on 7 27."
    safeToTranslate: false
  - subIndex: 28
    text: "关于感谢"
    translated: "About gratitude"
    safeToTranslate: false
  - subIndex: 29
    text: "最难的时候，有游戏群里的玩家兄弟给我转账，有几十，有几百甚至上千。那一刻我明白了一件事"
    translated: "At the hardest times, players from my gaming group would transfer money to me, amounts ranging from tens to hundreds, even thousands. In that moment, I realized something."
    safeToTranslate: false
  - subIndex: 30
    text: "只要你认真做游戏，虽然会有人质疑你、诋毁你，但也一定会有人真心支持你。"
    translated: "As long as you take the game seriously, even if some people doubt and slander you, there will also be those who genuinely support you."
    safeToTranslate: false
  - subIndex: 31
    text: "感谢一直信任我的玩家。"
    translated: "Thank you to all players who have trusted me."
    safeToTranslate: false
  - subIndex: 32
    text: "见。"
    translated: "See"
    safeToTranslate: false
