- raw: "\\n\\n版本号 V 1.1.0.0游戏更新内容 \\n\\n【新增剧情及人物】\\n1. 塞外战场新增任务【厨中乾坤】及相关人物。\\n2. 长安城新增任务【刀耕火种】及相关人物。\\n3. 长安城新增任务【荒城追凶】及相关人物。\\n4. 长安城新增任务【家传秘宝】及相关人物。\\n5. 洛阳城新增任务【雾里看花】及相关人物。\\n\\n【BUG修正】\\n1. 剧情模式补充“震古烁今”境界缺失的武器图纸，该类图纸可通过本次新增任务获取。\\n2. 修复世界生成时,对于新增角色和剧情的处理可能出现异常的问题\\n3. 清理帮派库房冗余内容，删除重复的【小周天扇法】心决与【两仪剑法】心决。\\n4. 调整部分BOSS属性平衡：防御力降低20%，攻击力提升20%，优化战斗体验。\\n5. 提升部分在“登峰造极”、“返璞归真”境界中，战斗所获得的装备掉落概率，助力玩家战力提升。\\n6. 修复部分操作引发的存档异常问题。\\n7. 修正玩家无法挑战自身曾创建且已禅让帮派的问题。\\n8. 修正一类大地图buff状态有时显示异常的问题。\\n9. 修正储物箱容量可能异常溢出的问题。\\n10. 修复天气特效和音频偶尔播放异常的问题。\\n11. 修复一处极端情况下玩家角色在大地图上会自动行走而不受控的问题。\\n\\n【游戏优化】\\n1. 优化玩家和NPC的数据结构及序列化性能。\\n2. 优化对话系统逻辑及相关动画表现。\\n3. 进一步改善装备界面,商店界面的性能。\\n4. 进一步优化战斗AI技能施展和攻击队列逻辑。\\n5. 沙盒模式大理地图里增加轻功【凌波微步】全本秘籍宝箱。\\n6. 优化内功【七煞铁衣功】技能描述，补充【煞血骨】【北朔】【血骨饮】仅对主角生效的效果说明，明确技能适用范围。\\n7. 野外BOSS、剧情战斗增加境界等级为【炉火纯青】的武器图纸掉落概率。\\n8. 野外BOSS、剧情战斗增加火器武器图纸掉落概率。\\n\\n\\n版本号 V 1.0.2.0\\n【重大调整】\\n1.去掉登录时的网络验证，可以完全脱离网络，单机游玩。\\n\\n【问题修正】\\n1. 修正部分天赋的生效逻辑\\n2. 修正读档后部分NPC行为逻辑错误的问题\\n3. 修正个别UI界面在特殊分辨率设备中适配不正确的问题\\n4. 修正武林大会有时不准时开启的问题\\n5. 修正帮派商店同伴打工的一处逻辑错误\\n6. 处理自动存档时线程资源冲突可能导致存档失败的问题\\n7. 修复同伴是亲友时的一处关系逻辑错误\\n\\n【体验调优】\\n1. 沙盒模式野外补充额外刷新点、额外产出修为、区域声望\\n2. 沙盒模式屏蔽不必要的耗能逻辑,并优化数值体验\\n3. 模组编辑器蓝图缩放逻辑优化、拖拽边界逻辑优化\\n2. 优化部分战斗特效纹理质量和粒子性能\\n3. 统一UI界面对ESC键操作的响应逻辑\\n4. 修正AB包每次打包的一致性问题,从而减少每次更新包的大小\\n5. 修正极端网络环境下与steam云同步可能存在的逻辑异常\\n6. 优化游戏网络传输协议,修正公告更新逻辑\\n7. 优化图形API支持,优化静态合批逻辑,改善抗锯齿和后处理性能\\n8. 增加Addressable资源管理支持,优化对象池缓存机制\\n\\n正式版1.0.1.3版本已更新，内容如下:\\n\\n【功能优化】\\n引擎版本升级\\n优化地图地点英文版显示\\n优化战斗时偶尔卡顿的问题\\n\\n【问题修正】：\\n修正外部模组有可能加载失败的问题\\n修正帮派旗帜偶尔无法点击的问题\\n修正帮派可能出现重复的成员问题(可能引起无法团战)\\n修正玩家获得物品数量可能为0的bug\\n\\n正式版1.0.1.2版本已更新，内容如下:\\n\\n【重大更新】：\\n全英文版本正式发布，英文翻译程度99%以上。\\n\\n【问题修正】：\\n修正了几处因随机数引起的错误问题。\\n修正了创意工坊地牢模组树状结构读取的异常问题。\\n补充处理沙盒模式的部分隐性问题，并优化代码层。\\n优化修复了部分动态交互物名称显示问题。\\n\\n【功能优化】\\n优化了针对不同版本的小地图工作的适配情况。\\n优化了模组保存时的适配情况。\\n \\n正式版1.0.1.1版本更新内容:\\n\\n【体验调优】\\n1.优化了部分地图的传送点逻辑，此改动会影响部分NPC跨地图的行为，如在地牢中分道扬镳后NPC的行动路线等。\\n2.优化了部分地图资源的加载逻辑，使得加载更顺畅。\\n3.优化调整整体结构，提升程序整体编译速度以及游戏本体运行的流畅度。\\n4.优化了多语言版本的适配性，当前支持更多细节翻译，此功能将稍晚与全球多语言功能同步上线。\\n\\n【问题修正】\\n1.修正了多个堆叠的物品同步卖出时偶发的异常问题。\\n2.修正了部分极端条件下，部分NPC所处位置异常的问题。\\n3.修正了当前较多随机NPC选取武器种类较少的问题，此次调整后将逐步回归预计水平。\\n4.微调了部分人物的剧情立绘，增强其美术表现效果。\\n5.总体修复部分极端条件小型BUG。\\n\\n【新增功能】\\n1.新增同伴突破境界时的自动贯通经脉功能。\\n2.提高了行囊内的俘虏角色的数量上限，现在玩家可以同时拥有更多的俘虏了。\\n\\n【创意工坊重大更新】\\n创意工坊新增动作节点，支持执行时机选项，当前版本玩家可在此基础上，更自由和精确地设定与编辑自己的任务系统，运用不同的节点与条件，可以进行关于任务的精准设计与投放，实现与游戏内原有任务系统相似的效果。\\n\\n一．动作节点新增：\\nNPC好感度变化调整：当前可以使用此动作节点，将NPC对玩家的好感度进行“设置为”或“好感度增/减”\\n交情关系：当前可以使用此动作节点，将NPC与玩家的关系进行设置与改变。\\n浮窗提示：当前可以使用此动作节点，获得与游戏本体任务系统一致的弹窗提示体验，文本编写体验。\\n\\n二．分支节点条件新增：\\nNPC好感度判断：当前可以使用此分支节点，以某个NPC对玩家的好感度为判定条件来开启后续剧情，或分支线路剧情。\\n交情关系判断：当前可以使用此分支节点，以某个NPC和玩家所有的关系为判定条件来开启后续剧情，或分支线路剧情。\\n新增触发器节点状态判断：此触发器会根据玩家编写的剧情与分支节点条件而实时判断任务流程和任务走向。\\n\\n三．触发器节点新增：\\n支持默认对话，与任务重复触发：当前在未满足玩家所设定的分支条件判断，或回头话设计时，将能够支持给某些角色使用恒定的对话。\\n \\n四．分支节点新增类型：\\n多选项对话：玩家可以自由设定多个选项，每个选项都可以对应不同的分支，触发不同的剧情，触发不同的指令等。\\n\\n五．其他创意工坊优化项\\n1. 优化了分支节点的UI自适应逻辑，使其更加易读与可用。\\n2. 优化了分支节点的复制逻辑，使其更加方便使用，降低上手成本与操作繁琐度。\\n3. 优化了节点端口间的连接逻辑，使其更加清晰与稳定。\\n4. 优化了编辑器模式打开MOD时，等待配置加载完毕处的细致逻辑，增强了其稳定性。\\n5. 修正了部分模组NPC在创建时，极端条件导致的默认剧情立绘显示错误的问题。\\n\\n正式版1.0.0.16版本更新内容:\\n\\n【体验调优】\\n新增64套剧情立绘，立绘选择界面支持长按快速切换。\\n支持退出杀手组织。\\n飞鸽传书中显示相关NPC的实时坐标。\\n剧情NPC武学切磋增加二次确认对话。\\n游戏内系统菜单界面支持打开本地日志目录，反馈问题时自动打开。\\n\\n帮派支持总舵迁移，调整联盟解散逻辑。\\n帮派成员界面性能优化，避免成员数量很多时产生卡顿。\\n帮派关系列表增加显示帮派等级。\\n帮派界面响应ESC键退出。\\n帮派出征人员不能再去打工。\\n\\n\\n【问题修正】\\n修正西班牙区域设置下无法战斗的问题。\\n修正按键设置两套之间切换和保存的逻辑。\\n修正部分语言下存档的难度显示错误。\\n\\n修正剧情NPC被抓后意志力为0的问题。\\n修正随机NPC很多都是会刀剑枪武学不会拳法，但都是空武器的问题。\\n修正资源采集永远为1的问题。\\n修正京城捕快巡逻路线。\\n\\n修正帮派囚犯缺少【收为家仆】对话选项的问题。\\n修正帮派囚犯成为家仆后的对话异常。\\n\\n修正沙盒剧情NPC的轻内功武学和交情列表。\\n修正沙盒剧情NPC对话内容和选项。\\n修正沙盒剧情NPC Mod立绘弃用后没有切换回原始立绘的问题。\\n\\n修正了[千秋大业]任务未移走宋红玉的问题\\n修正[地碎天倾]中天下人尸首坐标错误问题\\n修改[河洛归一]任务指引文本,增加需要完成[镇国之秘]的提示\\n修正[伪侠迷踪]的一处错字\\n修正部分存在[明心立志·二]指引的存档不可以接取任务的问题\\n修正了沙盒拓跋笑和沈无暇的坐标\\n\\n修正了部分武学与通式的配置错误\\n修正了非门派NPC使用门派武学功法的问题\\n\\n\\n正式版1.0.0.15版本更新内容:\\n\\n【体验调优】\\n商店支持输入购买出售数量，支持一键调整数量到最大或最小。\\n优化大地图跑图时的性能表现。\\n帮派成员是队友则不能追杀和囚禁。\\n进入武林大会新增限制条件。\\n补充了一部分随机NPC的传送路径。\\n新增沙盒模式下杭州可售房屋的配置。\\n为洛阳城太平密窟添加了宝箱。\\n新增洛阳太平秘窟入口和怪物。\\n新增任务[千金名剑]。\\n任务[毒医钜子]完成后的任务指引，由[一等风雅]改为[潇湘公子]。\\n补充了部分剧情战斗中的随机武器掉落。\\n新增部分战斗组。\\n调整部分传送设置，当前玩家在执行壁城水寨系列剧情时，传送功能会暂时关闭，防止卡档。\\n\\n【问题修正】\\n修正了京城酒楼内部下雨的问题。\\n修正了洛阳、京城镖车生成地点与到达地点重合出现的报错问题。\\n修改了任务[醇酒醉影]的触发方式，改为地点触发。\\n修正了任务[净蛊天池]中的一处错误文本。\\n修正了极少数旧存档无法前往五圣教的问题。\\n修正了卸下装备的三才书时，会覆盖背包里的三才书的问题。\\n修正了极端情况下，部分豪华版游戏火枪武器皮肤不显示的问题。\\n修正剧情NPC名字显示有时只有称号状态没有原名的情况。\\n修正帮派吞并后产业归属显示没有刷新的问题。\\n修正空帮派存在残余成员的问题。\\n修正打工同伴没有立即出现在商店、打工同伴可能会被抓走入狱的问题。\\n\\n\\n正式版1.0.0.14版本更新内容:\\n\\n修复了部分武学秘籍，玩家伙伴学习后无法正常释放的问题，并修复了以下武学秘籍的同伴AI错误问题：\\n《神通剑指》\\n《槎枒寻梅》\\n《羁离谱》\\n《弑流·伐剑取》\\n《天威军阵刀术》\\n\\n新增功能：支持帮主禅让，与指定成员互换位阶。\\n\\n当前玩家在地牢密室或封闭空间内，作恶将不再增加缉捕值（向外界亲友勒索钱财等依旧会增加缉捕值）。\\n\\n将终章奖励任务中的神通剑指秘籍改为全本秘籍。\\n\\n修正了一处手柄键位可能重复的错误。\\n\\n修正了剧情NPC移动时可能引发崩溃的问题。\\n\\n桃花坞区域副本新增桃花坞区域声望掉落。\\n\\n桃花坞决战任务接取时，对应靠岸的小船将会移回原位。\\n\\n\\n正式版1.0.0.13版本更新内容:\\n\\n剧情任务相关：\\n任务[三霄合一]提交完成时，将不再扣除对应道具，并针对三宵剑任务修改（此修改可兼容新老存档）\\n添加了任务[庖厨客卿·三]完成后,任务[东海遗孤·一]的任务指引。\\n完成与邓克礼第二次切磋时,选项添加境界推荐提示文本。\\n修正了任务[行凶灭口]的触发前置条件。\\n任务[隐市栖鸿]进行期间将不再关闭任务[残章幻赤]。\\n\\n战斗相关：\\n修复了羁离谱被动招式【锥骨】效果异常的问题。\\n修复了太虚无极劲被动招式【见素抱朴】、【天道行乾】、【太实若虚】没有降低技能调息时间的问题。\\n调整了杀手组织追杀玩家时派遣的杀手难度，由BOSS级下调至精英级。\\n\\n其他体验调整：\\n修正了剧情NPC俘虏位置逻辑。\\n修正了自创帮派的成员称号。\\n当前空帮派和荒废帮派不参与帮战支援，也不再发生关系变化。\\n优化了自建帮派的初始卡点禁飞。\\n各铁匠铺补充了锻造类合成材料的售卖投放。\\n调整了现有部分商贩售卖的材料数量。\\n统一按照境界等级调整了装备类道具的合成材料数量需求。\\n调整了食品类成品的售卖价格。\\n部分杀手任务的要求时限由30天改为60天。\\n解决杀手组织任务中，部分NPC处于隐匿行踪的问题。\\n修改了帮派战争迎战的文本描述，使其更加清晰易读。\\n新增补充了神通剑指的心诀投放位置，使其更易获取。\\n更新了豪华版枪法的动作表现。\\n\\n\\n正式版1.0.0.12版本更新内容:\\n\\n【体验调优】\\n\\n1.    优化了剧情npc（不可俘获选项开启时）的入队谈话逻辑。\\n2.    修改天赋【天狼孤煞】与天赋【天纵之才】的文本描述，使其更清晰易读。\\n3.    调整杀手组织追杀战斗难度，由3名杀手调整为1名。\\n4.    优化了副本挑战体验，去除了副本挑战冷却时间限制。\\n5.    增加BOSS战斗结算后的修为奖励。\\n6.    暂时停用杀手组织派遣的强制任务功能。\\n7.    优化开放世界事件体验，大幅下调飞鸽传书事件的触发频次。\\n8.    优化了所有语言的任务配置表和沙盒交互物配置表。\\n9.    洛阳新增了一个水井交互物。\\n\\n【问题修正】\\n\\n1.    修正了第一次进入游戏获取分辨率可能发生异常导致游戏黑屏闪屏的问题。\\n2.    修正了用户使用暗器武器时释放魍魉鬼步轻功卡住的问题。\\n3.    修正了大地图按键设置可能不生效的问题；暂不允许设置小键盘按键。\\n4.    修正了襄阳一处帮派入口禁入点的异常。\\n5.    修正了承安镇黑市购买的全本秘籍出现招式残缺的错误（当前再次购买此商店物品时，秘籍招式将会显示正常了）。\\n6.    修正了隋东关金鲤商队的商店中的一处错误。\\n7.    修正了任务[风萧萧兮·二]的任务道具。\\n8.    删除了任务[花朝月夜]的一句对话选项。\\n9.    修正了五圣教和太和山门派执事退出门派功能的一处错误。\\n10.   修改了任务[青萍村识武]的武器【破麻索】的道具品质。\\n11.   修改所有交互天涯海阁【左三思】触发的任务，将其改为地点触发。\\n12.   修正了任务【西园二郎】的触发问题。\\n13.   修正了任务【铜佛疑云】的NPC消失问题。\\n14.   修正了角色【北豺】尸首错误的问题。\\n15.   修正了壁城水寨中一个NPC水贼的错误移动问题。\\n16.   修复了暴雨梨花刀被动【棃绽重】减少调息时间不生效的问题。\\n17.   修复了镇国抵岳枪秘籍影响属性的文本描述错误问题。\\n18.   修复了太极拳【抱元守一】被动效果层数无法叠加的问题。\\n19.   修复了三才书-天衍弃世卷槽位描述错误的问题。\\n20.   修复了湘竹葬兰书被动【藏北海】文本描述错误的问题。\\n21.   修复了擎骨金虹决心决【渺渺然】、【归骨地】无法装备的问题，【归骨地】心决从内功攻击增加修改为外功攻击增加。\\n\\n\\n正式版1.0.0.11版本更新内容:\\n\\n【体验调优】\\n1.    帮派招新失败时给出提示。\\n\\n【问题修正】\\n1.    修正游戏系统和按键设置可能被重置的问题。\\n2.    修正剧情NPC入队的谈话逻辑。\\n3.    修正部分剧情中部分角色（如左三思）等移动至特定位置，导致与其交叉的任务线无法推进的问题。【此处理仅对5.2日之前未完成任务（天涯海角）的存档生效，全存档修正正在进行中，预计很快修正。】\\n4.    调整杀手任务中，追杀玩家的杀手境界等级与数值。\\n\\n V1.0.0.10版本更新内容:\\n\\n【问题修正】\\n1. 修正帮派任务刷新逻辑。\\n2. 修正帮派成员人数限制判断。\\n3. 修正帮派产业攻占派遣界面队列逻辑。\\n\\nV1.0.0.9版本更新内容:\\n\\n【体验调优】\\n1. 剧情立绘mod被移除时切换使用动态立绘而不是显示默认剧情立绘剪影。\\n2. 帮派出征的同伴增加显示标识\\n\\n【问题修正】\\n1. 修正空帮派会参与产业攻占的问题。\\n2. 修正沙盒模式的Mod npc入队异常。\\n3. 修正附属帮派被吞并的处理逻辑。\\n\\nV1.0.0.8版本更新内容:\\n\\n【体验调优】\\n1. 防止加载缓慢导致的黄条位置初始化问题。\\n\\n【问题修正】\\n1. 修正一处杀手组织功能异常。\\n2. 修正帮派解散的逻辑。\\n3. 修正有些宝箱无法交互的问题。\\n4. 修正京城一处帮派地牢传送点异常的问题。\\n5. 修正了[药到病除]的触发问题。\\n6. 修正了[一统江湖]的一处错误文本。\\n7. 修正了NPC张维庸的对话触发条件。\\n8. 修复部分EA存档无法读取的问题\\n\\nV1.0.0.7版本更新内容:\\n\\n【体验调优】\\n1.帮派产业攻击代理派遣可派遣同伴。\\n\\n【问题修正】\\n1.修复部分情况下进游戏黑屏的问题。\\n2.修正[天涯海角]的NPC移动错误。\\n3.修改[玉石俱焚·二]交互左三思的触发条件为左三思地块触发。\\n4.对一个已经废弃的战斗编辑器配置进行容错判空处理，防止战斗编辑器配置中没有删除干净。\\n5.修改帮派吞并总部逻辑,增加荒废帮派驻地概念。（解决找不到的幽灵帮派的问题）\\n\\nV1.0.0.6版本更新内容:\\n\\n【体验调优】\\n1.统一npc详情界面页签显示。\\n\\n【问题修正】\\n1.修正帮派产业攻占派遣结束时可能出现异常的问题。\\n2.修正壁城水寨副本可能无法进入战斗的问题。\\n3.修正一个战斗buff导致的战斗崩溃错误。\\n\\nV1.0.0.5版本更新内容:\\n\\n【体验调优】\\n1.调整了剧情立绘选取按钮的翻译。\\n2.移除了襄阳废弃矿洞的禁行路点。\\n3.为沙盒模式的帮派任务添加了修为奖励。\\n4.微调武林大会战斗中各角色战斗胜率算法。\\n\\n【问题修正】\\n1.修正了在沙盒模式下，通过杭州城船夫无法前往桃花坞的问题。\\n2.修正了钓鱼界面“执竿垂钓”按钮提示信息未刷新，未执行“精力不足判断”的问题。\\n3.修正了战斗胜利后掉落界面的装备属性与进入背包的装备属性不符的问题。\\n4.修正了某个版本天赋技能没有显示所需点数的问题。\\n5.修正了繁体版本，属性界面在特定情况下显示异常的问题。\\n6.修正了繁体版本，【面具】与【服装】选项混乱的问题。\\n7.修正了特定情况下，京城任务【天涯海角】会重复循环的问题。\\n8.补充处理了“尚未实装”的三才书。\\n9.修正了洛阳城琵琶僧立绘错误的问题。\\n10.修正了特定情况下，六脉神剑技能无伤害的问题。\\n11.排查并修正了沙盒模式各个传送点可能存在的的传送错误问题。\\n12.加固战斗逻辑，防止极端情况下可能会出现的战斗卡死报错问题。\\n\\nV1.0.0.0-V1.0.0.4更新内容:：\\n【界面优化】\\n调整生活系统、武林大会报名/比斗界面显示异常问题\\n优化钓鱼玩法水域移动速度配置\\n统一武林大会玩法说明按钮的「感叹号」图标样式\\n调整任务追踪字体显示，修复字体重影问题\\n游戏模式选择框优化\\n\\n【玩法优化】\\n新手引导结束前屏蔽武林大会功能入口\\n武林大会期间与主理人交互增加「返回」选项\\n调整杀手任务触发频率为「半年一次」，计数单位改为日\\n修正自创帮派名称同步显示问题\\n优化剧情NPC对话逻辑（沙盒模式与交情关系关联）\\n修正剧情演出中缺失的立绘、台词及战斗配置\\n优化大雪山任务NPC站位与出场逻辑\\n\\n【系统优化】\\n优化NPC「参与武林大会」，筛选逻辑\\n移除大雪山任务冗余卡点\\n修正沙盒模式中船夫传送、新手武器选择异常问题\\n\\n【BUG修复】\\n功能异常修复\\n修复旧存档卡读条无法进入游戏的问题\\n修复战斗组闪退、NPC复活异常及BOSS血条消失问题\\n修复沙盒模式中交互界面文本不一致问题\\n修复退出战斗后BGM未恢复场景音乐的问题\\n显示与逻辑修复\\n修复杜颜白立绘、属性及动态形象异常\\n修正武林大会重复NPC（李映心、杜颜白头像错误）\\n修复京城、大雪山地图黑边及NPC消失问题\\n修正武馆交易界面乱码及物品缺失问题\\n文本与交互修复\\n修复任务指引错误、追踪倒计时未显示问题\\n修正错别字、标点符号及对话立绘配置\\n修复杀手任务超期卡死、钓鱼界面状态未刷新问题\\n战斗与数值修复\\n修正武学技能伤害异常（沧海观澜刀法、暴雨梨花等）\\n修复NPC被动技能等级配置错误\\n修正战斗组配置缺失导致的直接跳剧情问题\\n\\nV1.0.0.0版本更新内容:\\n\\n主线&支线：15个大地图（5个门派）以及其他小地图，百万＋剧情文案\\n武学：十余种兵器，数十套武学/轻功/内功、武学混用、神功、三才书系统、天赋等\\n帮派玩法：自建帮派、帮派战争、吞并帮派、收服帮派等\\nNPC互动：同伴、仇家、家仆、生育等\\n其他重要玩法：武林大会、随机事件、生活、钓鱼、青楼、赌坊、地牢、捕快、杀手等\\n\\n在创建存档时可以选择普通与无剧情模式，普通模式包含所有玩法，无剧情模式屏蔽了剧情任务，且玩家的成长与提升将会更加困难，一切都将从零开始（不推荐新玩家游玩，建议玩家通关剧情模式后再行体验。）\\n"
  splits:
  - text: "版本号"
    translated: "Version number"
  - subIndex: 1
    text: "1.1.0.0游戏更新内容"
    translated: "1.1.0.0Game Update Content"
  - subIndex: 2
    text: "【新增剧情及人物】"
    translated: "[New Story and Characters]"
  - subIndex: 3
    text: "塞外战场新增任务【厨中乾坤】及相关人物。"
    translated: "Frontier Battlefield has added a new quest [The Kitchen's Secrets] and related characters."
  - subIndex: 4
    text: "长安城新增任务【刀耕火种】及相关人物。"
    translated: "Chang'an has added a new quest [Plow and Burn] and related characters."
  - subIndex: 5
    text: "长安城新增任务【荒城追凶】及相关人物。"
    translated: "Chang'an has added the quest 【Tracking Down the Culprit in the Ruined City】 and related characters."
  - subIndex: 6
    text: "长安城新增任务【家传秘宝】及相关人物。"
    translated: "Chang'an has added a new quest 【Family Heirloom】 and related characters."
  - subIndex: 7
    text: "洛阳城新增任务【雾里看花】及相关人物。"
    translated: "Luoyang City has added a new quest [Through a Misty Veil] and related characters."
  - subIndex: 8
    text: "修正】"
    translated: "[Correct]"
  - subIndex: 9
    text: "剧情模式补充“震古烁今”境界缺失的武器图纸，该类图纸可通过本次新增任务获取。"
    translated: "The Story mode will add blueprints for Peerless Realm weapons that were previously missing. These blueprints can be obtained through new quests added this time."
  - subIndex: 10
    text: "修复世界生成时"
    translated: "Fixing the world generation when"
  - subIndex: 11
    text: "对于新增角色和剧情的处理可能出现异常的问题"
    translated: "There may be issues with handling new characters and story additions."
  - subIndex: 12
    text: "清理帮派库房冗余内容，删除重复的【小周天扇法】心决与【两仪剑法】心决。"
    translated: "Clear the gang warehouse of redundant content, delete the duplicate 'Microcosmic Orbit Fan Art' Heart Formula and 'Twin Polarity Sword Art' Heart Formula."
  - subIndex: 13
    text: "调整部分"
    translated: "Adjust part"
  - subIndex: 14
    text: "属性平衡"
    translated: "Attribute Balance"
  - subIndex: 15
    text: "防御力降低20%，攻击力提升20%，优化战斗体验。"
    translated: "Defense decreased by 20%, Attack Power increased by 20%, optimizing combat experience."
  - subIndex: 16
    text: "提升部分在“登峰造极”、“返璞归真”境界中，战斗所获得的装备掉落概率，助力玩家战力提升。"
    translated: "Increase the drop rate of equipment in battles when reaching the Pinnacle and Transcendence Realms, aiding players in boosting their combat strength."
  - subIndex: 17
    text: "修复部分操作引发的存档异常问题。"
    translated: "Fix archive anomalies caused by certain actions"
  - subIndex: 18
    text: "修正玩家无法挑战自身曾创建且已禅让帮派的问题。"
    translated: "Fix the issue where players cannot challenge a gang they once created and have already abdicated from."
  - subIndex: 19
    text: "修正一类大地图"
    translated: "Fix a type of world map"
  - subIndex: 20
    text: "状态有时显示异常的问题。"
    translated: "The issue with the status sometimes displaying abnormally."
  - subIndex: 21
    text: "修正储物箱容量可能异常溢出的问题。"
    translated: "Fix the storage box capacity issue to prevent overflow."
  - subIndex: 22
    text: "修复天气特效和音频偶尔播放异常的问题。"
    translated: "Fix the issue with weather effects and audio playing sporadically incorrectly."
  - subIndex: 23
    text: "修复一处极端情况下玩家角色在大地图上会自动行走而不受控的问题。"
    translated: "Fix an issue where the player character may walk automatically on the overworld map without player control in extreme cases."
  - subIndex: 24
    text: "【游戏优化】"
    translated: "[Game Optimization]"
  - subIndex: 25
    text: "优化玩家和"
    translated: "Optimize player and"
