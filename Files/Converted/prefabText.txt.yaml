- raw: "临表致信，公子台鉴:\\n\\n还请公子莫以一时乱了心神，我已飞鸽传书于京城王家，只是山高路远，恐难相顾。\\n\\n南宫家尚与武当有几分渊源，请公子即刻前往武当求援，那时承安镇，方有一线生机。\\n\\n此去艰辛，万望公子保重，若事不可为……公子，切莫再归。\\n\\n\\n\\n                                      南宫莲笔\\n"
  splits:
  - text: "临表致信，公子台鉴"
    translated: "Respectfully writing this letter, Young Lord:"
    qcReviewedText: "Respectfully writing this letter, Young Lord:: \\n\\nPlease don't let your composure be disturbed for a moment. I have already sent a Carrier Pigeon to the Wang family in the Capital City, but with the mountains and long distances, it may be difficult to receive assistance in time.\\n\\nThe Nangong family still has some ties to Wudang; please, Young Lord, go to Wudang for help at once. Only then will Cheng'an Town have a chance of survival.\\n\\nThe journey ahead will be arduous; I earnestly hope you take care, Young Lord. If things cannot be done..., Young Lord, do not return.\\n\\n\\n\\n                                      Nangong Lian's brush\\n"
    qcTranslated: "Respectfully writing this letter, Young Lord:: \\n\\nPlease don't let your composure be disturbed for a moment. I have already sent a Carrier Pigeon to the Wang family in the Capital City, but with the mountains and long distances, it may be difficult to receive assistance in time.\\n\\nThe Nangong family still has some ties to Wudang; please, Young Lord, go to Wudang for help at once. Only then will Cheng'an Town have a chance of survival.\\n\\nThe journey ahead will be arduous; I earnestly hope you take care, Young Lord. If things cannot be done..., Young Lord, do not return.\\n\\n\\n\\n                                      Nangong Lian"
    qcStatus: Corrected
