  - subIndex: 426
    text: "1.修正了在沙盒模式下，通过杭州城船夫无法前往桃花坞的问题。"
    translated: "1. fixed the issue of not being able to travel to Taohua Dock via the Hangzhou City boatman in sandbox mode."
    safeToTranslate: false
  - subIndex: 427
    text: "2.修正了钓鱼界面“执竿垂钓”按钮提示信息未刷新，未执行“精力不足判断”的问题。"
    translated: "2. fixed the fishing interface issue where the Hold Rod and Fish button prompt did not refresh and failed to check for insufficient Energy."
    safeToTranslate: false
  - subIndex: 428
    text: "3.修正了战斗胜利后掉落界面的装备属性与进入背包的装备属性不符的问题。"
    translated: "3. fixed the issue where the equipment attributes in the drop interface after a battle victory did not match the attributes of the equipment once it was added to the inventory."
    safeToTranslate: false
  - subIndex: 429
    text: "4.修正了某个版本天赋技能没有显示所需点数的问题。"
    translated: "4. fixed an issue where some talent skills were not displaying the required points."
    safeToTranslate: false
  - subIndex: 430
    text: "5.修正了繁体版本，属性界面在特定情况下显示异常的问题。"
    translated: "5. fixed an issue where the Attributes interface displayed abnormally in certain situations for the traditional Chinese version."
    safeToTranslate: false
  - subIndex: 431
    text: "6.修正了繁体版本，【面具】与【服装】选项混乱的问题。"
    translated: "6. fixed the issue with the confusion between the Mask and Outfit options in the traditional Chinese version."
    safeToTranslate: false
  - subIndex: 432
    text: "7.修正了特定情况下，京城任务【天涯海角】会重复循环的问题。"
    translated: "7. fixed the issue where the Capital City mission 【Heaven's Edge, Sea's Corner】 would repeat in certain situations."
    safeToTranslate: false
  - subIndex: 433
    text: "8.补充处理了“尚未实装”的三才书。"
    translated: "8. supplemented the not yet implemented Three Talents Tome."
    safeToTranslate: false
  - subIndex: 434
    text: "9.修正了洛阳城琵琶僧立绘错误的问题。"
    translated: "9. fixed the issue with the incorrect portrait of the Pipa Monk in Luoyang City."
    safeToTranslate: false
  - subIndex: 435
    text: "10.修正了特定情况下，六脉神剑技能无伤害的问题。"
    translated: "10. fixed the issue where the Six Pulse Divine Sword skills caused no damage in certain situations."
    safeToTranslate: false
  - subIndex: 436
    text: "11.排查并修正了沙盒模式各个传送点可能存在的的传送错误问题。"
    translated: "11. investigated and corrected potential teleportation errors at all the teleportation points in Sandbox mode."
    safeToTranslate: false
  - subIndex: 437
    text: "12.加固战斗逻辑，防止极端情况下可能会出现的战斗卡死报错问题。"
    translated: "12. strengthen battle logic to prevent combat freeze or error issues in extreme cases."
    safeToTranslate: false
