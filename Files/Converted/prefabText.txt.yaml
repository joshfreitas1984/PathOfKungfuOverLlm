  - subIndex: 115
    text: "【创意工坊重大更新】"
  - subIndex: 116
    text: "创意工坊新增动作节点，支持执行时机选项，当前版本玩家可在此基础上，更自由和精确地设定与编辑自己的任务系统，运用不同的节点与条件，可以进行关于任务的精准设计与投放，实现与游戏内原有任务系统相似的效果。"
  - subIndex: 117
    text: "一．动作节点新增"
  - subIndex: 118
    text: "好感度变化调整"
  - subIndex: 119
    text: "当前可以使用此动作节点，将"
  - subIndex: 120
    text: "对玩家的好感度进行“设置为”或“好感度增"
  - subIndex: 121
    text: "减”"
  - subIndex: 122
    text: "交情关系"
  - subIndex: 123
    text: "当前可以使用此动作节点，将"
  - subIndex: 124
    text: "与玩家的关系进行设置与改变。"
  - subIndex: 125
    text: "浮窗提示"
  - subIndex: 126
    text: "当前可以使用此动作节点，获得与游戏本体任务系统一致的弹窗提示体验，文本编写体验。"
  - subIndex: 127
