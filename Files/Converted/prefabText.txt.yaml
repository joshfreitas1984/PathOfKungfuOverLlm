- raw: "青城山的墨白，珍珠城的欧阳，再加上南海娘子……这世上，本来已没有什么事能打动他们的了，但现在他们都已出手。叶开若知道，一定会觉得很愉快！"
  splits:
  - text: "青城山的墨白，珍珠城的欧阳，再加上南海娘子……这世上，本来已没有什么事能打动他们的了，但现在他们都已出手。叶开若知道，一定会觉得很愉快！"
    translated: "Moboai of Qingcheng Mountain, Ou Yang of Pearl City, and now the Lady of the South Sea... In this world, nothing could move them anymore, but they have all taken action. If Ye Kai knew about this, he would surely be very pleased!"
