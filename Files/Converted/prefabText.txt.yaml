- raw: "人行书，曰万灵之长，非有爪牙利齿，亦无皮囊毛铠之防，唯余灵心一点，百道长存，变化万千，探天窥地，夯尽奥妙，自成生灵之首，唯人之道也。"
  splits:
  - text: "人行书，曰万灵之长，非有爪牙利齿，亦无皮囊毛铠之防，唯余灵心一点，百道长存，变化万千，探天窥地，夯尽奥妙，自成生灵之首，唯人之道也。"
    translated: "Humans write their own destiny, the masters of all spirits. Without sharp claws or fangs, without scales or fur for armor, they possess but a single point of spirit, yet a myriad of Dao paths endure, transforming endlessly, exploring the heavens and delving into the earth, mastering all wonders, thus becoming the pinnacle of life, the way of humanity alone."
- raw: "他拉紧了衣襟，再问，没有回应，那个一直在外面望风的车夫呢？天气实在太冷，他本不想离开这温暖的车厢，可是一个人做了亏心事后，总难免会疑神疑鬼的。他终于穿上靴子，跳下车，四面一片黑暗，寒冷而寂静。那个穿着青布棉袄的车夫，躲在一堆稻草里。"
  splits:
  - text: "他拉紧了衣襟，再问，没有回应，那个一直在外面望风的车夫呢？天气实在太冷，他本不想离开这温暖的车厢，可是一个人做了亏心事后，总难免会疑神疑鬼的。他终于穿上靴子，跳下车，四面一片黑暗，寒冷而寂静。那个穿着青布棉袄的车夫，躲在一堆稻草里。"
    translated: "He pulled his coat tighter and asked again, but there was no response. Where was the coachman who had been keeping watch outside? The weather was so cold that he didn't want to leave the warm carriage, but after doing something wrong, one can't help feeling paranoid. Finally, he put on his boots, jumped down from the carriage, and stepped into the darkness, cold and silent. The coachman, wearing a blue cotton coat, was hiding in a pile of straw."
