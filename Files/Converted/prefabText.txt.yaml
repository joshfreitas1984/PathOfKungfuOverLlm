- raw: "江湖通式是各类武器的通用技能，不消耗真气而是消耗体力使用的技能，一般是浮空技或者位移技，可以强制中断当前的普通攻击释放。当你切换武器类型的时候，会自动切换到对应武器种类的江湖通式。可以在各地武馆购买学习。"
  splits:
  - text: "江湖通式是各类武器的通用技能，不消耗真气而是消耗体力使用的技能，一般是浮空技或者位移技，可以强制中断当前的普通攻击释放。当你切换武器类型的时候，会自动切换到对应武器种类的江湖通式。可以在各地武馆购买学习。"
    translated: "The Jianghu Common Form is a universal skill for various weapons. It does not consume True Qi but instead uses Stamina. These skills are typically aerial techniques or movement skills and can forcibly interrupt your current normal attack to be released. When you switch weapon types, it will automatically switch to the corresponding Jianghu Common Form for that weapon type. You can purchase and learn them at martial arts halls across the regions."
