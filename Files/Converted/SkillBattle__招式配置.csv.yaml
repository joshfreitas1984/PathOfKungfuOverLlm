- raw: "557,2010901,吸星噬寰图,噬寰吞鸿,内功,,1,7,主动,武学总章,,,按键后，消耗10%血量，把正前方4步半径内敌人向我方位置吸引，同时吸取敌方真气，每0.3秒造成1次伤害，每个成功伤害的敌人减少1点真元（如果有真元），且给与我方。持续1.8秒，（随时可以松开按键，或者等技能自动结束）。如果吸取后真元总数量超过自身真元上限Y，会给与自己BUFF真气充溢（提升攻击力百分比（X-Y）Y），持续3秒，真气充溢消失时会自爆给自己造成（X-Y）Y*总血量的伤害，并给与我方DEBUFF，降低20%防御，降低内劲产生速度50%，持续5秒，。（此技能敌方可以格挡，但依然会被吸向施法者移动）,,5,,,0,增加buff,2010901,,内功攻击*0.3,1;1,\"主动招式：按下键位后，消耗10%气血，把正前方敌人向我方位置吸引，同时吸取敌方真气并造成内功攻击，每个受到伤害的敌人吸取1点真元。如果吸取的真元超过自身真元上限，获得【充盈】效果，提升自身内功攻击，该效果持续5秒，【充盈】效果消失会产生自爆给自己造成伤害，同时获得【反噬】效果,自身降低20%防御，50%内劲产生速度，持续5秒。\",\"主动招式：按下键位后，消耗10%气血，把正前方敌人向我方位置吸引，同时吸取敌方真气并造成内功攻击，每个受到伤害的敌人吸取1点真元。如果吸取的真元超过自身真元上限，获得【充盈】效果，提升自身内功攻击，该效果持续5秒，【充盈】效果消失会产生自爆给自己造成伤害，同时获得【反噬】效果,自身降低20%防御，50%内劲产生速度，持续5秒。\",0,0,,,,,1,2,30,,,,,,,neigong_xixingzuohuantu,neigong_xixingzuohuantu_2,,tricks/2010901,"
