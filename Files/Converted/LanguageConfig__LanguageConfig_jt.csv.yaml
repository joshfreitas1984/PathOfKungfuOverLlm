- raw: "903,betShopTip17,>摇骰阶段\\n摇骰阶段是骰宝游戏的开始，点击“摇骰”按钮，即可进行下注。\\n\\n>下注阶段\\n在任意区域完成下注后，即可点击“开骰！”，点击按钮后，进入“结算阶段”。\\n点击“重置所有投注”按钮后，将所有区域的投注银两数量重置为默认值0。\\n\\n>结算阶段\\n若押注与开骰结果一致，则返回赌本并获得对应的赔率。\\n\\n>下注区域说明\\n1.大/小下注区\\n开骰结果的骰子总点数符合大/小区域对应点数，即可获得对应的赔率银两。\\n\\n2.全围下注区\\n开骰结果的三个骰子相符，即可获得对应的赔率银两。\\n\\n3.围骰下注区\\n开骰结果的三个骰子相符，且三个骰子的总点数符合下注区域值，即可获得对应的赔率银两。\\n\\n4.点数下注区\\n开骰结果的骰子总点数符合下注区域值，即可获得对应的赔率银两。。"
  splits:
  - split: 2
    text: "摇骰阶段"
    translated: "Roll Dice Phase"
    qcReviewedText: ">Roll Dice Phase \\nThe dice rolling phase marks the beginning of the Sic Bo game; click the Roll Dice button to place your bets.\\n\\n>Betting phase \\nAfter placing your bet in any area, you can click Roll the Dice! Clicking the button will proceed to the Settlement Phase.\\nAfter clicking the Reset All Bets button, reset the bet Silver in all areas to the default value 0.\\n\\n>Settlement phase \\nIf the bet matches the dice roll result, return the stake and receive the corresponding odds.\\n\\n>Bet area instructions \\n1. Great/Small betting area \\nThe total number of dice points matches the requirement for great./Small areas correspond to points, and you can obtain the corresponding odds in Silver.\\n\\n2. surround the betting area \\nIf the three dice match when opening the results, you will receive the corresponding odds in Silver.\\n\\n3.betting area \\nIf the three dice match the bet result and the total number of dots on the three dice matches the value of the betting area, you will receive the corresponding odds in Silver.\\n\\n4. point betting area \\nIf the total dice roll matches the value of the betting area, you will receive the corresponding odds in Silver."
    qcTranslated: ">Roll Dice Phase \\nThe dice rolling phase marks the beginning of the Sic Bo game; click the Roll Dice button to place your bets.\\n\\n>Betting phase \\nAfter placing your bet in any area, you can click Roll the Dice! Clicking the button will proceed to the Settlement Phase.\\nAfter clicking the Reset All Bets button, reset the bet Silver in all areas to the default value 0.\\n\\n>Settlement phase \\nIf the bet matches the dice roll result, return the stake and receive the corresponding odds.\\n\\n>Bet area instructions \\n1. Great/Small betting area \\nIf the total number of dice points matches the requirement for the Great or Small areas, you can obtain the corresponding odds in Silver.\\n\\n2. Full Surround betting area \\nIf the three dice match when opening the results, you will receive the corresponding odds in Silver.\\n\\n3. Surround Dice betting area \\nIf the three dice match and the total number of dots on the three dice matches the value of the betting area, you will receive the corresponding odds in Silver.\\n\\n4. Point betting area \\nIf the total dice roll matches the value of the betting area, you will receive the corresponding odds in Silver."
