- raw: "927,UIFinshingTip_1,1.小游戏开始后，持续按住“鼠标左/右键”，即可控制“指针”持续向左/右进行移动。\\n\\n2.当“指针”与“鱼所在水域”有重合时，则圆环进度会持续增长，当达到100%时，表示钓鱼成功，获得经验值及道具奖励。\\n\\n3.当“指针”与“鱼所在水域”未重合时，则圆环进度会持续消退，若达到0%时，则意味则钓鱼失败，无任何奖励。\\n\\n4.“鱼所在水域”分为“长/中/短”三档，“鱼所在水域”越短则获取稀有渔获的概率越大。"
  splits:
