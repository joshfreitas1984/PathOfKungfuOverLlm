    text: "1.小游戏开始后，持续按住“鼠标左"
    translated: "'1.After starting the mini-game, hold down the left mouse button continuously."
    qcReviewedText: "'1.After starting the mini-game, hold down the left mouse button continuously./Right-click, the pointer will continue to move left./Move to the right \\n\\n2.When the pointer overlaps with the fishing area, the ring progress will continue to grow. When it reaches 100%, it indicates a successful fishing, earning experience points and item rewards.\\n\\n3.When the pointer and the fishing area do not overlap, the ring progress will continue to fade. If it reaches 0%, it means fishing has failed and there will be no reward.\\n\\n4.Fish Habitat is divided into Long/Middle/The shorter the Skill Level, the greater the probability of catching rare fish."
    qcTranslated: "1.After starting the mini-game, hold down the left/right mouse button continuously to control the pointer to move left/right continuously.\\n\\n2.When the pointer overlaps with the fish's water area, the ring progress will continue to grow. When it reaches 100%, it indicates a successful Fishing, earning experience points and item rewards.\\n\\n3.When the pointer and the fish's water area do not overlap, the ring progress will continue to fade. If it reaches 0%, it means the Fishing has failed, with no rewards.\\n\\n4.The fish's water area is divided into Long/Medium/Short tiers; the shorter the fish's water area, the greater the probability of catching rare fish."
