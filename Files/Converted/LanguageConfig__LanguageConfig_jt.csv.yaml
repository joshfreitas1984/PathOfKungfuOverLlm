- raw: "927,UIFinshingTip_1,1.小游戏开始后，持续按住“鼠标左/右键”，即可控制“指针”持续向左/右进行移动。\\n\\n2.当“指针”与“鱼所在水域”有重合时，则圆环进度会持续增长，当达到100%时，表示钓鱼成功，获得经验值及道具奖励。\\n\\n3.当“指针”与“鱼所在水域”未重合时，则圆环进度会持续消退，若达到0%时，则意味则钓鱼失败，无任何奖励。\\n\\n4.“鱼所在水域”分为“长/中/短”三档，“鱼所在水域”越短则获取稀有渔获的概率越大。"
  splits:
  - split: 2
    text: "1.小游戏开始后，持续按住“鼠标左"
  - split: 2
    subIndex: 1
    text: "右键”，即可控制“指针”持续向左"
  - split: 2
    subIndex: 2
    text: "右进行移动。"
  - split: 2
    subIndex: 3
    text: "2.当“指针”与“鱼所在水域”有重合时，则圆环进度会持续增长，当达到100%时，表示钓鱼成功，获得经验值及道具奖励。"
  - split: 2
    subIndex: 4
    text: "3.当“指针”与“鱼所在水域”未重合时，则圆环进度会持续消退，若达到0%时，则意味则钓鱼失败，无任何奖励。"
  - split: 2
    subIndex: 5
    text: "4.“鱼所在水域”分为“长"
  - split: 2
    subIndex: 6
    text: "中"
  - split: 2
    subIndex: 7
    text: "短”三档，“鱼所在水域”越短则获取稀有渔获的概率越大。"
  templates:
  - split: 2
    template: "{0}/{1}/{2}\\n\\n{3}\\n\\n{4}\\n\\n{5}/{6}/{7}"
