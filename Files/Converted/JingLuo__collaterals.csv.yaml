    translated: "The Yang Ming Meridian of the Hand, starting from the tip of the second toe, runs up along the ulnar side of the fingers, exiting between the two bones at the He Gu point, then enters between the two tendons, ascends along the outer front part of the arm, and enters the outer side of the elbow."
