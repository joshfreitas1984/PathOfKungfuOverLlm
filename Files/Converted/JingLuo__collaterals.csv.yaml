- raw: "3,101,1,手太阴经,Lung Meridian,内功防御+5,1,1,10101,肺手太阴之脉，起于中焦，下络大肠，还循胃口，上膈属肺，从肺系横出腋下，下循臑内，行少阴、心主之前，下肘中，循臂内上骨下廉。,前往经脉界面的手太阴经，完成所有冲穴之后，贯通此经脉。,,,"
