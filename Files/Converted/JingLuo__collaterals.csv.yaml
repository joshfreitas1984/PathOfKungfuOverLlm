    text: "手太阴经"
    translated: "Hand Taiyin Meridian"
  - split: 9
    text: "肺手太阴之脉，起于中焦，下络大肠，还循胃口，上膈属肺，从肺系横出腋下，下循臑内，行少阴、心主之前，下肘中，循臂内上骨下廉。"
    translated: "The Hand-Taiyin Lung Meridian originates in the middle energizer, descends to connect with the large intestine, then follows the stomach region upward to the diaphragm and connects to the lungs. From there, it extends horizontally across the armpit, descends along the inner part of the upper arm, runs in front of the Heart-Protector Meridian and the Kidney Meridian, continues down to the elbow, and then follows the inner side of the forearm, along the anterior border of the ulna."
  - split: 10
    text: "前往经脉界面的手太阴经，完成所有冲穴之后，贯通此经脉。"
    translated: "Go to the meridians interface and complete all acupoint breakthroughs on the Hand Taiyin Meridian to connect this meridian."
